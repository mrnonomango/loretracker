<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lorcana Cookout — Interview OBS Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:white}.stage{position:absolute;inset:0;overflow:hidden;background:transparent}/* Flowing Lorcana ink currents: six ink colors, no image assets or visible line art. */
/* Same six-ink composition as the Starting Soon artwork, clipped to the side panels.
   Keep the interview camera opening fully transparent. */
.side{position:absolute;top:0;bottom:0;width:15%;overflow:hidden;isolation:isolate;background:#10131c}
.side.left{left:0}
.side.right{right:0}
.inkWorld{position:absolute;top:0;width:100vw;height:100%;overflow:hidden;pointer-events:none;background:#10131c}
.side.left .inkWorld{left:0}
.side.right .inkWorld{right:0}
.inkWash{position:absolute;inset:-5%;background:
 radial-gradient(ellipse 32% 42% at 7% -5%,rgba(203,150,52,.92),transparent 86%),
 radial-gradient(ellipse 31% 40% at 49% -7%,rgba(164,40,60,.86),transparent 82%),
 radial-gradient(ellipse 34% 49% at 103% 3%,rgba(33,103,191,.92),transparent 85%),
 radial-gradient(ellipse 30% 42% at 0% 103%,rgba(114,43,155,.90),transparent 85%),
 radial-gradient(ellipse 35% 37% at 51% 111%,rgba(16,111,77,.90),transparent 84%),
 radial-gradient(ellipse 30% 45% at 102% 103%,rgba(153,173,185,.89),transparent 87%),
 radial-gradient(ellipse 67% 65% at 50% 50%,#11141e 40%,#11141e 65%,transparent 100%);
 filter:url(#interviewInkRipple);
 transform:scale(1.05);
 animation:inkDrift 19s ease-in-out infinite alternate;
}
.inkDepth{position:absolute;inset:0;background:
 radial-gradient(ellipse 34% 44% at 42% 49%,rgba(13,16,25,.75),transparent 96%),
 radial-gradient(ellipse 24% 35% at 5% 53%,rgba(8,12,21,.76),transparent 95%),
 radial-gradient(ellipse 24% 35% at 95% 55%,rgba(8,12,21,.72),transparent 95%);
 pointer-events:none}
.inkFleck{position:absolute;width:var(--w);height:var(--h);left:var(--x);top:var(--y);border-radius:55% 45% 65% 35%;background:var(--ink);opacity:var(--a);transform:rotate(var(--rot));animation:fleckFloat var(--speed) ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes inkDrift{from{transform:translate(-1%,-.5%) scale(1.05)}to{transform:translate(1.2%,.9%) scale(1.06)}}
@keyframes fleckFloat{to{transform:translate(5px,-8px) rotate(calc(var(--rot) + 20deg))}}
.cameraOutline{position:absolute;top:0;bottom:0;left:15%;right:15%;border-left:2px solid #c99c56;border-right:2px solid #c99c56;pointer-events:none}.tag{position:absolute;top:6%;left:18%;font-size:20px;font-weight:700;color:#e2bf7c;letter-spacing:.15em}.nameplates{position:absolute;bottom:7%;left:18%;right:18%;display:grid;grid-template-columns:1fr 1fr;gap:2.5%;z-index:3}.nameplate{position:relative;isolation:isolate;overflow:hidden;background:#0b1e32;border-left:5px solid #f0c85b;box-shadow:0 8px 22px #050719af;padding:20px;min-width:0;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1);opacity:1;transform:translateY(0)}/* Soft animated ink behind the interview names; keep every letter sharp. */
.nameplate::before{
 content:"";position:absolute;inset:-70%;z-index:-2;pointer-events:none;
 background:
 radial-gradient(ellipse at 18% 27%,rgba(255,188,47,.76),transparent 31%),
 radial-gradient(ellipse at 78% 20%,rgba(200,39,61,.65),transparent 31%),
 radial-gradient(ellipse at 75% 72%,rgba(44,125,236,.78),transparent 38%),
 radial-gradient(ellipse at 23% 70%,rgba(148,67,223,.64),transparent 32%),
 radial-gradient(ellipse at 56% 44%,rgba(16,169,100,.68),transparent 33%),
 radial-gradient(ellipse at 45% 90%,rgba(181,200,220,.48),transparent 35%);
 filter:blur(19px);animation:plateInkFlow 17s ease-in-out infinite alternate;
}
.nameplate#p2::before{animation-delay:-8s;animation-direction:alternate-reverse}
.nameplate::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(110deg,rgba(6,17,35,.83),rgba(9,28,48,.77));}
.nameplate .name,.nameplate .subtitle{position:relative;z-index:1}
@keyframes plateInkFlow{
 0%{transform:translate(-10%,-5%) rotate(-8deg) scale(1)}
 50%{transform:translate(5%,6%) rotate(6deg) scale(1.09)}
 100%{transform:translate(-2%,-4%) rotate(-3deg) scale(1.03)}
}
.nameplate.hidden{opacity:0;transform:translateY(120%);pointer-events:none;position:absolute;width:48.75%;bottom:0}.nameplate.hidden#p1{left:0}.nameplate.hidden#p2{right:0}.nameplates.solo{grid-template-columns:1fr}.nameplates.solo .nameplate:not(.hidden){width:48.75%;justify-self:center;animation:soloCenter .55s ease both}.name{font-size:36px;font-weight:900;color:#f4cf6b;text-shadow:0 2px 4px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{margin-top:6px;font-size:22px;color:#eaca83;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@keyframes soloCenter{from{opacity:.85;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes drift{to{transform:translateY(14%) rotate(9deg)}}@media(prefers-reduced-motion:reduce){.inkWash,.inkFleck,.nameplate::before{animation:none}.nameplate{transition:none}}
</style></head><body><main class="stage"><svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true"><defs><filter id="interviewInkRipple" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".008 .019" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="36" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg><div class="side left"><div class="inkWorld"><div class="inkWash"></div><div class="inkDepth"></div></div></div><div class="side right"><div class="inkWorld"><div class="inkWash"></div><div class="inkDepth"></div></div></div><div class="cameraOutline"></div><div class="tag">THE LORCANA COOKOUT</div><div class="nameplates" id="plates"><div class="nameplate" id="p1"><div class="name" id="n1">Person 1</div><div class="subtitle" id="s1"></div></div><div class="nameplate" id="p2"><div class="name" id="n2">Person 2</div><div class="subtitle" id="s2"></div></div></div></main>
<script>
/* Small true ink flecks rather than a pastel fog. Decorative, deterministic and lightweight. */
(()=>{let seed=43792;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const palette=["#d49d3b","#b52c45","#367ccc","#8946a8","#118965","#b6c7d1"];
for(const side of document.querySelectorAll(".side")){
 const world=side.querySelector(".inkWorld");
 for(let i=0;i<120;i++){
  const x=rnd()*100,y=rnd()*100,band=y<38?0:y>63?1:2;
  let color=palette[band===0?(x<32?0:x<66?1:2):band===1?(x<32?3:x<66?4:5):(x<33?3:x>67?2:4)];
  const fleck=document.createElement("i");fleck.className="inkFleck";
  const props={"--x":x+"%","--y":y+"%","--w":(2+rnd()*9)+"px","--h":(1+rnd()*4)+"px","--ink":color,"--a":(.16+rnd()*.52).toFixed(2),"--rot":(rnd()*130-65)+"deg","--speed":(9+rnd()*11)+"s","--delay":(-rnd()*12)+"s"};
  for(const [k,v] of Object.entries(props))fleck.style.setProperty(k,v);
  world.appendChild(fleck);
 }
}
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",authDomain:"lore-counter-4e654.firebaseapp.com",databaseURL:"https://lore-counter-4e654-default-rtdb.firebaseio.com",projectId:"lore-counter-4e654"});
const db=getDatabase(app);const data={};const $=id=>document.getElementById(id);
function paint(){for(let i=1;i<=2;i++){const p=data[i]||{};$("n"+i).textContent=String(p.name??("Person "+i));$("s"+i).textContent=String(p.subtitle??"");$("p"+i).classList.toggle("hidden",p.visible===false)}$("plates").classList.toggle("solo",[1,2].filter(i=>data[i]?.visible!==false).length===1)}
for(let i=1;i<=2;i++)onValue(ref(db,"interview/person"+i),snap=>{data[i]=snap.val()||{};paint()});
</script></body></html>
