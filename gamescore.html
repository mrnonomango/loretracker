<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .player {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 0;
    }


    /* =========================
       PLAYER POSITIONS
       ========================= */

    #p1_games {
      top: 40%;
      left: 25%;
    }

    #p2_games {
      top: 60%;
      right: 25%;
    }


    /* =========================
       GAME ICON HOLDER
       ========================= */

    .tick {
      position: relative;

      width: 144px;
      height: 144px;

      flex-shrink: 0;

      transition: transform 0.15s ease;
    }


    /* =========================
       PULL SECOND ICON CLOSER
       ========================= */

    .tick + .tick {
      margin-left: -63px;
    }


    /* =========================
       EMPTY GAME OUTLINE
       ========================= */

    .empty-outline {
      position: absolute;

      width: 144px;
      height: 144px;

      top: 0;
      left: 0;

      pointer-events: none;
    }


    .empty-outline svg {
      width: 144px;
      height: 144px;

      display: block;
      overflow: visible;
    }


    /* =========================
       GAME WON WHITE FILL

       DEFAULT = HIDDEN
       ========================= */

    .win-fill {
      position: absolute;

      width: 108px;
      height: 108px;

      top: 18px;
      left: 18px;

      object-fit: contain;

      display: block;

      opacity: 0;

      pointer-events: none;

      transition: opacity 0.15s ease;
    }


    /* =========================
       GAME WON

       TRANSPARENT -> WHITE
       ========================= */

    .tick.filled .win-fill {
      opacity: 1;
    }


    /* =========================
       WIN PULSE
       ========================= */

    .pulse {
      animation: pulse 0.35s ease;
    }


    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       SVG DEFINITIONS

       WHITE OUTLINE WITH
       TRUE TRANSPARENT CENTER
       ========================= -->

  <svg
    width="0"
    height="0"
    style="position:absolute;"
  >

    <defs>

      <mask
        id="illuminaryOutlineMask"
        maskUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="144"
        height="144"
      >

        <!-- MASK BACKGROUND -->

        <rect
          x="0"
          y="0"
          width="144"
          height="144"
          fill="black"
        />


        <!-- OUTER ILLUMINARY SHAPE -->

        <image
          href="./Illuminary%20Icon_White.png"
          x="0"
          y="0"
          width="144"
          height="144"
          preserveAspectRatio="xMidYMid meet"
        />


        <!-- =====================
             TRANSPARENT CUTOUT

             108 x 108

             SMALLER CUTOUT =
             MUCH BOLDER OUTLINE
             ===================== -->

        <image
          href="./Illuminary%20Icon_White.png"
          x="18"
          y="18"
          width="108"
          height="108"
          preserveAspectRatio="xMidYMid meet"
          style="filter:brightness(0);"
        />

      </mask>

    </defs>

  </svg>



  <div class="container">


    <!-- =========================
         PLAYER 1
         ========================= -->

    <div id="p1_games" class="player">


      <!-- GAME 1 -->

      <div id="p1g1" class="tick">

        <div class="empty-outline">

          <svg viewBox="0 0 144 144">

            <rect
              x="0"
              y="0"
              width="144"
              height="144"
              fill="white"
              mask="url(#illuminaryOutlineMask)"
            />

          </svg>

        </div>


        <img
          class="win-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


      <!-- GAME 2 -->

      <div id="p1g2" class="tick">

        <div class="empty-outline">

          <svg viewBox="0 0 144 144">

            <rect
              x="0"
              y="0"
              width="144"
              height="144"
              fill="white"
              mask="url(#illuminaryOutlineMask)"
            />

          </svg>

        </div>


        <img
          class="win-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>

    </div>



    <!-- =========================
         PLAYER 2
         ========================= -->

    <div id="p2_games" class="player">


      <!-- GAME 1 -->

      <div id="p2g1" class="tick">

        <div class="empty-outline">

          <svg viewBox="0 0 144 144">

            <rect
              x="0"
              y="0"
              width="144"
              height="144"
              fill="white"
              mask="url(#illuminaryOutlineMask)"
            />

          </svg>

        </div>


        <img
          class="win-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


      <!-- GAME 2 -->

      <div id="p2g2" class="tick">

        <div class="empty-outline">

          <svg viewBox="0 0 144 144">

            <rect
              x="0"
              y="0"
              width="144"
              height="144"
              fill="white"
              mask="url(#illuminaryOutlineMask)"
            />

          </svg>

        </div>


        <img
          class="win-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>

    </div>


  </div>



<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


const p1GamesRef =
  ref(db, "p1Games");


const p2GamesRef =
  ref(db, "p2Games");


let lastP1 = 0;
let lastP2 = 0;


/* =========================
   RENDER GAME ICONS
   ========================= */

function render(
  player,
  wins,
  lastWins
) {

  const g1 =
    document.getElementById(
      player + "g1"
    );


  const g2 =
    document.getElementById(
      player + "g2"
    );


  /* GAME 1 */

  g1.classList.toggle(
    "filled",
    wins >= 1
  );


  /* GAME 2 */

  g2.classList.toggle(
    "filled",
    wins >= 2
  );


  /* =========================
     WIN PULSE
     ========================= */

  if (wins > lastWins) {

    const target =
      wins === 1
        ? g1
        : g2;


    target.classList.add(
      "pulse"
    );


    setTimeout(
      () => {

        target.classList.remove(
          "pulse"
        );

      },

      350
    );

  }

}


/* =========================
   PLAYER 1
   ========================= */

onValue(

  p1GamesRef,

  snap => {

    const wins =
      snap.val() || 0;


    render(
      "p1",
      wins,
      lastP1
    );


    lastP1 = wins;

  }

);


/* =========================
   PLAYER 2
   ========================= */

onValue(

  p2GamesRef,

  snap => {

    const wins =
      snap.val() || 0;


    render(
      "p2",
      wins,
      lastP2
    );


    lastP2 = wins;

  }

);

</script>

</body>
</html>
