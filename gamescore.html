<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .player {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 0;
    }


    /* =========================
       PLAYER POSITIONS
       ========================= */

    #p1_games {
      top: 40%;
      left: 25%;
    }

    #p2_games {
      top: 60%;
      right: 25%;
    }


    /* =========================
       GAME ICON HOLDER
       ========================= */

    .tick {
      position: relative;

      width: 144px;
      height: 144px;

      flex-shrink: 0;

      transition: transform 0.15s ease;
    }


    /* =========================
       PULL SECOND ICON CLOSER
       ========================= */

    .tick + .tick {
      margin-left: -63px;
    }


    /* =========================
       OUTER WHITE BORDER

       WHITE INSIDE =
       BLACK GLOW
       ========================= */

    .icon-outline-white {
      position: absolute;

      width: 144px;
      height: 144px;

      top: 0;
      left: 0;

      object-fit: contain;
      display: block;

      filter:
        drop-shadow(0 0 3px rgba(0, 0, 0, 1))
        drop-shadow(0 0 7px rgba(0, 0, 0, 0.85))
        drop-shadow(0 0 12px rgba(0, 0, 0, 0.55));

      pointer-events: none;

      transition: filter 0.15s ease;
    }


    /* =========================
       GAME WON:
       BLACK INSIDE =
       WHITE GLOW
       ========================= */

    .tick.filled .icon-outline-white {
      filter:
        drop-shadow(0 0 3px rgba(255, 255, 255, 0.95))
        drop-shadow(0 0 7px rgba(255, 255, 255, 0.55));
    }


    /* =========================
       BLACK BORDER LAYER
       ========================= */

    .icon-outline-black {
      position: absolute;

      width: 136px;
      height: 136px;

      top: 4px;
      left: 4px;

      object-fit: contain;
      display: block;

      filter: brightness(0);

      pointer-events: none;
    }


    /* =========================
       WHITE INNER LAYER
       ========================= */

    .icon-fill {
      position: absolute;

      width: 124px;
      height: 124px;

      top: 10px;
      left: 10px;

      object-fit: contain;
      display: block;

      filter: none;

      opacity: 1;

      pointer-events: none;

      transition: opacity 0.15s ease;
    }


    /* =========================
       GAME WON
       ========================= */

    .tick.filled .icon-fill {
      opacity: 0;
    }


    /* =========================
       CENTER ILLUMINARY SYMBOL

       SAME EXACT IMAGE AS
       THE OUTSIDE DESIGN
       ========================= */

    .center-symbol {
      position: absolute;

      width: 40px;
      height: 40px;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      object-fit: contain;

      display: block;

      z-index: 10;

      pointer-events: none;

      /* WHITE INSIDE = BLACK SYMBOL */
      filter: brightness(0);

      transition: filter 0.15s ease;
    }


    /* =========================
       GAME WON:

       BLACK INSIDE =
       WHITE SYMBOL
       ========================= */

    .tick.filled .center-symbol {
      filter: none;
    }


    /* =========================
       WIN PULSE
       ========================= */

    .pulse {
      animation: pulse 0.35s ease;
    }


    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>
</head>


<body>

  <div class="container">


    <!-- PLAYER 1 -->

    <div id="p1_games" class="player">


      <!-- GAME 1 -->

      <div id="p1g1" class="tick">

        <img
          class="icon-outline-white"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-outline-black"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="center-symbol"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


      <!-- GAME 2 -->

      <div id="p1g2" class="tick">

        <img
          class="icon-outline-white"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-outline-black"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="center-symbol"
          src="./Illuminary%20Icon_White.png"
        >

      </div>

    </div>



    <!-- PLAYER 2 -->

    <div id="p2_games" class="player">


      <!-- GAME 1 -->

      <div id="p2g1" class="tick">

        <img
          class="icon-outline-white"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-outline-black"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="center-symbol"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


      <!-- GAME 2 -->

      <div id="p2g2" class="tick">

        <img
          class="icon-outline-white"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-outline-black"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="center-symbol"
          src="./Illuminary%20Icon_White.png"
        >

      </div>

    </div>


  </div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


const p1GamesRef =
  ref(db, "p1Games");


const p2GamesRef =
  ref(db, "p2Games");


let lastP1 = 0;
let lastP2 = 0;


/* =========================
   RENDER GAME ICONS
   ========================= */

function render(
  player,
  wins,
  lastWins
) {

  const g1 =
    document.getElementById(
      player + "g1"
    );


  const g2 =
    document.getElementById(
      player + "g2"
    );


  g1.classList.toggle(
    "filled",
    wins >= 1
  );


  g2.classList.toggle(
    "filled",
    wins >= 2
  );


  if (wins > lastWins) {

    const target =
      wins === 1
        ? g1
        : g2;


    target.classList.add(
      "pulse"
    );


    setTimeout(
      () => {

        target.classList.remove(
          "pulse"
        );

      },

      350
    );

  }

}


/* =========================
   PLAYER 1
   ========================= */

onValue(

  p1GamesRef,

  snap => {

    const wins =
      snap.val() || 0;


    render(
      "p1",
      wins,
      lastP1
    );


    lastP1 = wins;

  }

);


/* =========================
   PLAYER 2
   ========================= */

onValue(

  p2GamesRef,

  snap => {

    const wins =
      snap.val() || 0;


    render(
      "p2",
      wins,
      lastP2
    );


    lastP2 = wins;

  }

);

</script>

</body>
</html>
