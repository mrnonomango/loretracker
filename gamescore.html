<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    .container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .player {
      position: absolute;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* KEEP YOUR POSITIONS (you'll crop anyway) */
    #p1_games {
      top: 40%;
      left: 25%;
    }

    #p2_games {
      top: 60%;
      right: 25%;
    }

    /* BASE TICK (idle) */
    .tick {
      width: 3px;
      height: 18px;
      border-radius: 2px;
      background: rgba(255, 160, 40, 0.18); /* subtle amber */
      transition: all 0.2s ease;
    }

    /* 🔥 FILLED (MATCHED TO YOUR OVERLAY) */
    .filled {
      background: rgba(255, 150, 30, 1); /* Lorcana orange core */
      box-shadow:
        0 0 4px rgba(255, 170, 60, 0.6),
        0 0 10px rgba(255, 120, 0, 0.35),
        0 0 18px rgba(255, 90, 0, 0.2);
    }

    /* ⚡ WIN PULSE */
    .pulse {
      animation: pulse 0.35s ease;
    }

    @keyframes pulse {
      0% { transform: scaleY(1); }
      50% { transform: scaleY(1.5); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Player 1 -->
    <div id="p1_games" class="player">
      <div id="p1g1" class="tick"></div>
      <div id="p1g2" class="tick"></div>
    </div>

    <!-- Player 2 -->
    <div id="p2_games" class="player">
      <div id="p2g1" class="tick"></div>
      <div id="p2g2" class="tick"></div>
    </div>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const p1GamesRef = ref(db, "p1Games");
const p2GamesRef = ref(db, "p2Games");

let lastP1 = 0;
let lastP2 = 0;

function render(player, wins, lastWins) {
  const g1 = document.getElementById(player + "g1");
  const g2 = document.getElementById(player + "g2");

  g1.classList.toggle("filled", wins >= 1);
  g2.classList.toggle("filled", wins >= 2);

  // pulse when increasing
  if (wins > lastWins) {
    const target = wins === 1 ? g1 : g2;
    target.classList.add("pulse");
    setTimeout(() => target.classList.remove("pulse"), 350);
  }
}

onValue(p1GamesRef, snap => {
  const wins = snap.val() || 0;
  render("p1", wins, lastP1);
  lastP1 = wins;
});

onValue(p2GamesRef, snap => {
  const wins = snap.val() || 0;
  render("p2", wins, lastP2);
  lastP2 = wins;
});
</script>

</body>
</html>
