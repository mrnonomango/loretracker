<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }


    .container {
      position: absolute;
      width: 100%;
      height: 100%;
    }


    .player {
      position: absolute;
      display: flex;

      /* CLOSER TOGETHER */
      gap: 5px;

      align-items: center;
    }


    /* =========================
       PLAYER POSITIONS
       ========================= */

    #p1_games {
      top: 40%;
      left: 25%;
    }


    #p2_games {
      top: 60%;
      right: 25%;
    }


    /* =========================
       GAME ICON HOLDER
       ========================= */

    .tick {
      position: relative;

      width: 46px;
      height: 46px;

      flex-shrink: 0;

      transition: transform 0.15s ease;
    }


    /* =========================
       BLACK OUTLINE LAYER
       ========================= */

    .icon-outline {
      position: absolute;

      width: 46px;
      height: 46px;

      top: 0;
      left: 0;

      object-fit: contain;

      display: block;

      /*
        MAKE ORIGINAL WHITE IMAGE BLACK.

        IMPORTANT:
        NO SCALE.
        NO TRANSLATE.
        NO FRACTIONAL PIXELS.
      */

      filter: brightness(0);

      pointer-events: none;
    }


    /* =========================
       WHITE INNER LAYER
       ========================= */

    .icon-fill {
      position: absolute;

      /*
        42px white image inside
        46px black image.

        Gives approximately a
        2px black outline.
      */

      width: 42px;
      height: 42px;

      top: 2px;
      left: 2px;

      object-fit: contain;

      display: block;

      filter: none;

      opacity: 1;

      pointer-events: none;

      transition: opacity 0.15s ease;
    }


    /* =========================
       GAME WON

       White disappears.
       Black image remains.
       ========================= */

    .tick.filled .icon-fill {
      opacity: 0;
    }


    /* =========================
       WIN PULSE
       ========================= */

    .pulse {
      animation: pulse 0.35s ease;
    }


    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>
</head>



<body>


  <div class="container">


    <!-- =====================
         PLAYER 1
         ===================== -->

    <div
      id="p1_games"
      class="player"
    >


      <!-- GAME 1 -->

      <div
        id="p1g1"
        class="tick"
      >

        <img
          class="icon-outline"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>



      <!-- GAME 2 -->

      <div
        id="p1g2"
        class="tick"
      >

        <img
          class="icon-outline"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


    </div>




    <!-- =====================
         PLAYER 2
         ===================== -->

    <div
      id="p2_games"
      class="player"
    >


      <!-- GAME 1 -->

      <div
        id="p2g1"
        class="tick"
      >

        <img
          class="icon-outline"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>



      <!-- GAME 2 -->

      <div
        id="p2g2"
        class="tick"
      >

        <img
          class="icon-outline"
          src="./Illuminary%20Icon_White.png"
        >

        <img
          class="icon-fill"
          src="./Illuminary%20Icon_White.png"
        >

      </div>


    </div>


  </div>



<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";



/* =========================
   FIREBASE
   ========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};



const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



/* =========================
   GAME SCORE REFERENCES
   ========================= */

const p1GamesRef =
  ref(
    db,
    "p1Games"
  );


const p2GamesRef =
  ref(
    db,
    "p2Games"
  );



let lastP1 = 0;

let lastP2 = 0;



/* =========================
   UPDATE GAME ICONS
   ========================= */

function render(
  player,
  wins,
  lastWins
) {


  const g1 =
    document.getElementById(
      player + "g1"
    );


  const g2 =
    document.getElementById(
      player + "g2"
    );



  /* GAME 1 */

  g1.classList.toggle(
    "filled",
    wins >= 1
  );



  /* GAME 2 */

  g2.classList.toggle(
    "filled",
    wins >= 2
  );



  /* =========================
     NEW WIN PULSE
     ========================= */

  if (
    wins > lastWins
  ) {


    const target =
      wins === 1
        ? g1
        : g2;


    target.classList.add(
      "pulse"
    );


    setTimeout(
      () => {

        target.classList.remove(
          "pulse"
        );

      },

      350
    );


  }


}



/* =========================
   PLAYER 1
   ========================= */

onValue(

  p1GamesRef,

  snap => {


    const wins =
      snap.val() || 0;


    render(
      "p1",
      wins,
      lastP1
    );


    lastP1 =
      wins;


  }

);



/* =========================
   PLAYER 2
   ========================= */

onValue(

  p2GamesRef,

  snap => {


    const wins =
      snap.val() || 0;


    render(
      "p2",
      wins,
      lastP2
    );


    lastP2 =
      wins;


  }

);


</script>


</body>
</html>
