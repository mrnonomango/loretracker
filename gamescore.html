<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    .container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .player {
      position: absolute;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* PLAYER POSITIONS */

    #p1_games {
      top: 40%;
      left: 25%;
    }

    #p2_games {
      top: 60%;
      right: 25%;
    }


    /* =========================
       ICON
       ========================= */

    .tick {
      width: 38px;
      height: 38px;

      object-fit: contain;

      /* EMPTY = WHITE */
      filter:
        drop-shadow(0 0 2px black)
        drop-shadow(0 0 3px rgba(0, 0, 0, 0.6));

      transition:
        filter 0.2s ease,
        transform 0.2s ease;
    }


    /* =========================
       GAME WON = BLACK
       ========================= */

    .filled {
      filter:
        brightness(0)
        drop-shadow(0 0 2px white)
        drop-shadow(0 0 4px rgba(255, 255, 255, 0.7));
    }


    /* =========================
       WIN PULSE
       ========================= */

    .pulse {
      animation: pulse 0.35s ease;
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.35);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>
</head>


<body>

  <div class="container">


    <!-- PLAYER 1 -->

    <div id="p1_games" class="player">

      <img
        id="p1g1"
        class="tick"
        src="Illuminary Icon_White.png"
      >

      <img
        id="p1g2"
        class="tick"
        src="Illuminary Icon_White.png"
      >

    </div>


    <!-- PLAYER 2 -->

    <div id="p2_games" class="player">

      <img
        id="p2g1"
        class="tick"
        src="Illuminary Icon_White.png"
      >

      <img
        id="p2g2"
        class="tick"
        src="Illuminary Icon_White.png"
      >

    </div>


  </div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


const p1GamesRef =
  ref(db, "p1Games");


const p2GamesRef =
  ref(db, "p2Games");


let lastP1 = 0;

let lastP2 = 0;


function render(player, wins, lastWins) {

  const g1 =
    document.getElementById(player + "g1");

  const g2 =
    document.getElementById(player + "g2");


  /* FIRST GAME */
  g1.classList.toggle(
    "filled",
    wins >= 1
  );


  /* SECOND GAME */
  g2.classList.toggle(
    "filled",
    wins >= 2
  );


  /* PULSE WHEN WIN ADDED */

  if (wins > lastWins) {

    const target =
      wins === 1
        ? g1
        : g2;

    target.classList.add("pulse");

    setTimeout(() => {

      target.classList.remove("pulse");

    }, 350);

  }

}


/* PLAYER 1 */

onValue(
  p1GamesRef,
  snap => {

    const wins =
      snap.val() || 0;

    render(
      "p1",
      wins,
      lastP1
    );

    lastP1 =
      wins;

  }
);


/* PLAYER 2 */

onValue(
  p2GamesRef,
  snap => {

    const wins =
      snap.val() || 0;

    render(
      "p2",
      wins,
      lastP2
    );

    lastP2 =
      wins;

  }
);

</script>

</body>
</html>
