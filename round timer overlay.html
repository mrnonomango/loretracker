<!DOCTYPE html>
<html>
<head>
  <title>OBS Timer Overlay</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .overlay {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30px;
      box-sizing: border-box;
    }

    .timer-box {
      background: rgba(20, 20, 20, 0.95);
      border: 3px solid #c9161d;
      border-radius: 20px;
      padding: 18px 55px 20px;
      min-width: 470px;
      text-align: center;
      box-shadow: 0 0 28px rgba(201, 22, 29, 0.45);
    }

    .round {
      color: white;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .time {
      color: white;
      font-size: 78px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 2px;
    }

    .warning {
      color: #ff3333;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="timer-box">
      <div class="round" id="roundText">ROUND 1</div>
      <div class="time" id="timerText">50:00</div>
    </div>
  </div>

  <script>
    const roundText = document.getElementById("roundText");
    const timerText = document.getElementById("timerText");

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return minutes + ":" + secs.toString().padStart(2, "0");
    }

    function updateOverlay() {
      const round = localStorage.getItem("obsRound") || "ROUND 1";
      const timeLeft = Number(localStorage.getItem("obsTimeLeft") || 3000);

      roundText.textContent = round;
      timerText.textContent = formatTime(timeLeft);

      if (timeLeft <= 300) {
        timerText.classList.add("warning");
      } else {
        timerText.classList.remove("warning");
      }
    }

    setInterval(updateOverlay, 250);
    updateOverlay();
  </script>
</body>
</html>
