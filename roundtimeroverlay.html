<!DOCTYPE html> 
<html>
<head>
  <title>Timer Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #overlayBox {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(255, 234, 150, 0.26),
          rgba(255, 234, 150, 0) 42%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(55, 145, 210, 0.22),
          rgba(55, 145, 210, 0) 55%
        ),
        linear-gradient(
          180deg,
          #214d78 0%,
          #123150 34%,
          #0b1e32 68%,
          #050c15 100%
        );

      border-radius: 6px;

      border: 2px solid #f0c85b;

      box-shadow:
        inset 0 0 25px rgba(255, 240, 175, 0.06),
        inset 0 0 45px rgba(35, 115, 180, 0.10),
        inset 0 0 60px rgba(0, 0, 0, 0.80),
        0 0 8px rgba(240, 200, 91, 0.24);

      padding: 8px 28px 10px 28px;
      box-sizing: border-box;

      width: 310px;
      height: 130px;
    }

    #roundName {
      font-size: 44px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.95),
        0 0 7px rgba(170, 245, 255, 0.65),
        0 0 14px rgba(55, 205, 255, 0.32);

      margin: 0 0 4px 0;
      line-height: 1;
      white-space: nowrap;
    }

    #time {
      font-size: 72px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.95),
        0 0 7px rgba(170, 245, 255, 0.65),
        0 0 14px rgba(55, 205, 255, 0.32);

      margin: 0;
      line-height: 0.95;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="overlayBox">

    <div id="roundName">
      Round 1
    </div>

    <div id="time">
      55:00
    </div>

  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const config = {
      apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
      authDomain: "lore-counter-4e654.firebaseapp.com",
      databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
      projectId: "lore-counter-4e654"
    };

    const app = initializeApp(config);

    const db = getDatabase(app);

    const timerRef = ref(db, "timer");

    let timerState = {
      roundName: "Round 1",
      remaining: 3300,
      running: false,
      startedAt: 0
    };

    function formatTime(totalSeconds) {

      const safe =
        Math.max(0, Number(totalSeconds) || 0);

      const minutes =
        Math.floor(safe / 60);

      const seconds =
        safe % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function computeRemaining() {

      const now = Date.now();

      let remaining =
        Number(timerState.remaining ?? 3300);

      const running =
        Boolean(timerState.running);

      const startedAt =
        Number(timerState.startedAt ?? 0);

      if (running && startedAt > 0) {

        const elapsed =
          Math.floor((now - startedAt) / 1000);

        remaining =
          Math.max(0, remaining - elapsed);
      }

      return remaining;
    }

    function render() {

      document
        .getElementById("roundName")
        .textContent =
          timerState.roundName || "Round 1";

      document
        .getElementById("time")
        .textContent =
          formatTime(computeRemaining());
    }

    onValue(timerRef, (snap) => {

      timerState =
        snap.val() || {
          roundName: "Round 1",
          remaining: 3300,
          running: false,
          startedAt: 0
        };

      render();
    });

    setInterval(render, 250);

    render();

  </script>

</body>
</html>
