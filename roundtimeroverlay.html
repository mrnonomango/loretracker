<!DOCTYPE html>
<html>
<head>
  <title>Timer Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #overlayBox {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

      background: #000;
      border-radius: 10px;
      border: 2px solid #d6a640;
      box-shadow: 0 0 10px rgba(214, 166, 64, 0.45);

      padding: 10px 22px 12px 22px;
      box-sizing: border-box;
      width: fit-content;
      height: fit-content;
    }

    #roundName {
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow:
        0 0 5px #d6a640,
        0 0 12px rgba(214, 166, 64, 0.7);
      margin: 0 0 4px 0;
      line-height: 1;
      white-space: nowrap;
    }

    #time {
      font-size: 72px;
      font-weight: bold;
      color: white;
      text-shadow:
        0 0 8px #d6a640,
        0 0 18px rgba(214, 166, 64, 0.65);
      margin: 0;
      line-height: 0.95;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="overlayBox">
    <div id="roundName">Round 1</div>
    <div id="time">55:00</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const config = {
      apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
      authDomain: "lore-counter-4e654.firebaseapp.com",
      databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
      projectId: "lore-counter-4e654"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    const timerRef = ref(db, "timer");

    let timerState = {
      roundName: "Round 1",
      remaining: 3300,
      running: false,
      startedAt: 0
    };

    function formatTime(totalSeconds) {
      const safe = Math.max(0, Number(totalSeconds) || 0);
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function computeRemaining() {
      const now = Date.now();

      let remaining = Number(timerState.remaining ?? 3300);
      const running = Boolean(timerState.running);
      const startedAt = Number(timerState.startedAt ?? 0);

      if (running && startedAt > 0) {
        const elapsed = Math.floor((now - startedAt) / 1000);
        remaining = Math.max(0, remaining - elapsed);
      }

      return remaining;
    }

    function render() {
      document.getElementById("roundName").textContent = timerState.roundName || "Round 1";
      document.getElementById("time").textContent = formatTime(computeRemaining());
    }

    onValue(timerRef, (snap) => {
      timerState = snap.val() || {
        roundName: "Round 1",
        remaining: 3300,
        running: false,
        startedAt: 0
      };

      render();
    });

    setInterval(render, 250);
    render();
  </script>
</body>
</html>
