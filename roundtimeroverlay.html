<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OBS Round Timer Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    #overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 420px;
      padding: 14px 24px;

      background: rgba(0, 0, 0, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

      text-align: center;
      box-sizing: border-box;
    }

    #overlayText {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      margin-bottom: 14px;
      line-height: 1;
    }

    .label {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c8c8d4;
      margin-bottom: 8px;
      font-weight: 700;
      line-height: 1;
    }

    #timer {
      font-size: 72px;
      font-weight: 900;
      color: #ff2f2f;
      white-space: nowrap;
      line-height: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div id="overlayText">Round 1</div>
    <div class="label">Time</div>
    <div id="timer">50:00</div>
  </div>

  <script>
    /*
      IMPORTANT:
      This ROOM_ID must match the ROOM_ID in controller.html.
      Change it to something unique for your stream.
    */
    const ROOM_ID = "red-saber-main-timer";

    const gun = Gun({
      peers: ["https://gun-manhattan.herokuapp.com/gun"]
    });

    const db = gun.get("obs-overlay-room").get(ROOM_ID);

    const overlayEl = document.getElementById("overlay");
    const overlayTextEl = document.getElementById("overlayText");
    const timerEl = document.getElementById("timer");

    let state = {
      overlayText: "Round 1",
      seconds: 3000,
      running: false,
      lastUpdate: Date.now(),
      showOverlay: true
    };

    function formatTime(totalSeconds) {
      totalSeconds = Math.max(0, Math.floor(totalSeconds));

      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;

      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function getCurrentSeconds() {
      if (!state.running) {
        return state.seconds;
      }

      const now = Date.now();
      const elapsed = Math.floor((now - state.lastUpdate) / 1000);

      return Math.max(0, state.seconds - elapsed);
    }

    function render() {
      overlayTextEl.textContent = state.overlayText || "Round 1";
      timerEl.textContent = formatTime(getCurrentSeconds());
      overlayEl.classList.toggle("hidden", !state.showOverlay);
    }

    db.on(data => {
      if (!data) return;

      state = {
        overlayText: data.overlayText || "Round 1",
        seconds: typeof data.seconds === "number" ? data.seconds : 3000,
        running: !!data.running,
        lastUpdate: typeof data.lastUpdate === "number" ? data.lastUpdate : Date.now(),
        showOverlay: data.showOverlay !== false
      };

      render();
    });

    setInterval(render, 250);
  </script>
</body>
</html>
