<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Controller</title>

  <meta name="viewport" content="
    width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no
  ">

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    body{
      margin:0;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#111;
      color:white;
      font-family:Arial, sans-serif;
      display:flex;
      flex-direction:column;
      touch-action:manipulation;
    }

    .playerHalf{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:6px;
      gap:2px;
      transform:translateY(-18px);
    }

    .topHalf{
      transform:rotate(180deg) translateY(-18px);
      border-bottom:2px solid #333;
    }

    .smallText{
      font-size:12px;
      color:#aaa;
    }

    .playerLabel{
      font-size:12px;
      color:#aaa;
    }

    .loreNumber{
      font-size:74px;
      font-weight:bold;
      line-height:1;
    }

    .nameInput{
      width:190px;
      padding:5px;
      font-size:16px;
      border:none;
      border-radius:8px;
      text-align:center;
      background:white;
    }

    .gameDots{
      display:flex;
      gap:5px;
      margin:1px 0;
    }

    .dot{
      width:12px;
      height:12px;
      border:2px solid gold;
      border-radius:50%;
      background:transparent;
    }

    .buttonRow{
      display:flex;
      gap:8px;
    }

    .loreButton{
      width:84px;
      height:84px;
      border:none;
      border-radius:16px;
      font-size:38px;
      color:white;
      font-weight:bold;
    }

    .plusBtn{
      background:green;
    }

    .minusBtn{
      background:red;
    }

    .resetLoreBtn{
      width:190px;
      height:42px;
      border:none;
      border-radius:10px;
      background:#7a2020;
      color:white;
      font-size:13px;
      font-weight:bold;
      margin-top:2px;
      position:relative;
      overflow:hidden;
    }

    .resetFill{
      position:absolute;
      left:0;
      top:0;
      height:100%;
      width:0%;
      background:rgba(255,255,255,0.25);
      transition:none;
      z-index:1;
    }

    .resetText{
      position:relative;
      z-index:2;
    }

    .gameButtonRow{
      display:flex;
      gap:6px;
      margin-top:2px;
    }

    .gameBtn{
      width:135px;
      height:46px;
      border:none;
      border-radius:12px;
      font-size:15px;
      font-weight:bold;
      color:white;
    }

    .goldBtn{
      background:#d4af37;
      color:black;
    }

    .resetBtn{
      background:#444;
      color:white;
    }

    .saveBtn{
      width:155px;
      height:40px;
      border:none;
      border-radius:10px;
      background:#2f8f6b;
      color:white;
      font-size:15px;
      font-weight:bold;
      margin-top:2px;
    }
  </style>
</head>

<body>

  <!-- TOP PLAYER -->
  <div class="playerHalf topHalf">

    <div class="smallText">Opponent Lore</div>

    <div id="p1_top" class="loreNumber">0</div>

    <div style="text-align:center;">

      <div class="playerLabel">Player 2</div>

      <div class="smallText">YOUR LORE</div>

      <div id="p2" class="loreNumber">0</div>

    </div>

    <input
      id="p2NameInput"
      class="nameInput"
      placeholder="Player 2 Name"
      style="transform:rotate(180deg);"
    >

    <div class="gameDots">

      <div id="p2g1" class="dot"></div>

      <div id="p2g2" class="dot"></div>

    </div>

    <div class="buttonRow">

      <button
        class="loreButton plusBtn"
        onclick="updateLore('p2',1)"
      >
        +
      </button>

      <button
        class="loreButton minusBtn"
        onclick="updateLore('p2',-1)"
      >
        −
      </button>

    </div>

    <button
      class="resetLoreBtn"
      onmousedown="startResetHold()"
      onmouseup="cancelResetHold()"
      onmouseleave="cancelResetHold()"
      ontouchstart="startResetHold()"
      ontouchend="cancelResetHold()"
    >

      <div class="resetFill" id="resetFill1"></div>

      <span class="resetText" id="resetText1">
        Hold To Reset Lore
      </span>

    </button>

    <div class="gameButtonRow">

      <button
        class="gameBtn goldBtn"
        onclick="addGameWin('p2')"
      >
        + Game P2
      </button>

      <button
        class="gameBtn resetBtn"
        onclick="resetGames()"
      >
        Reset Games
      </button>

    </div>

    <button
      class="saveBtn"
      onclick="saveNames()"
    >
      Save Names
    </button>

  </div>

  <!-- BOTTOM PLAYER -->
  <div class="playerHalf">

    <div class="smallText">Opponent Lore</div>

    <div id="p2_bottom" class="loreNumber">0</div>

    <div style="text-align:center;">

      <div class="playerLabel">Player 1</div>

      <div class="smallText">YOUR LORE</div>

      <div id="p1" class="loreNumber">0</div>

    </div>

    <input
      id="p1NameInput"
      class="nameInput"
      placeholder="Player 1 Name"
    >

    <div class="gameDots">

      <div id="p1g1" class="dot"></div>

      <div id="p1g2" class="dot"></div>

    </div>

    <div class="buttonRow">

      <button
        class="loreButton plusBtn"
        onclick="updateLore('p1',1)"
      >
        +
      </button>

      <button
        class="loreButton minusBtn"
        onclick="updateLore('p1',-1)"
      >
        −
      </button>

    </div>

    <button
      class="resetLoreBtn"
      onmousedown="startResetHold()"
      onmouseup="cancelResetHold()"
      onmouseleave="cancelResetHold()"
      ontouchstart="startResetHold()"
      ontouchend="cancelResetHold()"
    >

      <div class="resetFill" id="resetFill2"></div>

      <span class="resetText" id="resetText2">
        Hold To Reset Lore
      </span>

    </button>

    <div class="gameButtonRow">

      <button
        class="gameBtn goldBtn"
        onclick="addGameWin('p1')"
      >
        + Game P1
      </button>

      <button
        class="gameBtn resetBtn"
        onclick="resetGames()"
      >
        Reset Games
      </button>

    </div>

    <button
      class="saveBtn"
      onclick="saveNames()"
    >
      Save Names
    </button>

  </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const p1Ref = ref(db, "p1");
const p2Ref = ref(db, "p2");

const p1GamesRef = ref(db, "p1Games");
const p2GamesRef = ref(db, "p2Games");

const p1NameRef = ref(db, "p1Name");
const p2NameRef = ref(db, "p2Name");

let resetTimer;
let fillInterval;

function renderDots(player, wins){

  document.getElementById(player + "g1").style.background =
    wins >= 1 ? "gold" : "transparent";

  document.getElementById(player + "g2").style.background =
    wins >= 2 ? "gold" : "transparent";
}

onValue(p1Ref, snap => {

  let v = snap.val() || 0;

  p1.innerText = v;
  p1_top.innerText = v;
});

onValue(p2Ref, snap => {

  let v = snap.val() || 0;

  p2.innerText = v;
  p2_bottom.innerText = v;
});

onValue(p1GamesRef, snap => {

  renderDots("p1", snap.val() || 0);

});

onValue(p2GamesRef, snap => {

  renderDots("p2", snap.val() || 0);

});

onValue(p1NameRef, s => {

  p1NameInput.value = s.val() || "";

});

onValue(p2NameRef, s => {

  p2NameInput.value = s.val() || "";

});

window.updateLore = async (p,c)=>{

  let r = p === "p1"
    ? p1Ref
    : p2Ref;

  let v = (await get(r)).val() || 0;

  v = Math.max(0, Math.min(20, v + c));

  set(r, v);
};

window.startResetHold = ()=>{

  let progress = 0;

  document.getElementById("resetText1").innerText =
    "Resetting...";

  document.getElementById("resetText2").innerText =
    "Resetting...";

  fillInterval = setInterval(()=>{

    progress += 2;

    document.getElementById("resetFill1").style.width =
      progress + "%";

    document.getElementById("resetFill2").style.width =
      progress + "%";

  }, 30);

  resetTimer = setTimeout(()=>{

    set(p1Ref, 0);
    set(p2Ref, 0);

    resetButtons();

  }, 1500);
};

window.cancelResetHold = ()=>{

  clearTimeout(resetTimer);

  clearInterval(fillInterval);

  resetButtons();
};

function resetButtons(){

  document.getElementById("resetFill1").style.width =
    "0%";

  document.getElementById("resetFill2").style.width =
    "0%";

  document.getElementById("resetText1").innerText =
    "Hold To Reset Lore";

  document.getElementById("resetText2").innerText =
    "Hold To Reset Lore";
}

window.addGameWin = async p=>{

  let r = p === "p1"
    ? p1GamesRef
    : p2GamesRef;

  let v = (await get(r)).val() || 0;

  set(r, Math.min(2, v + 1));
};

window.resetGames = ()=>{

  set(p1GamesRef, 0);

  set(p2GamesRef, 0);
};

window.saveNames = ()=>{

  set(p1NameRef, p1NameInput.value);

  set(p2NameRef, p2NameInput.value);
};

</script>

</body>
</html>
