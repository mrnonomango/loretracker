<!DOCTYPE html>
<html>
<head>
  <title>Timer Controller</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      max-width: 440px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .preview {
      background: #1c1c1c;
      border: 2px solid #c9161d;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .preview-round {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .preview-time {
      font-size: 56px;
      font-weight: 900;
    }

    input, button {
      width: 100%;
      font-size: 22px;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      box-sizing: border-box;
      border: none;
    }

    input {
      background: #222;
      color: white;
      border: 1px solid #555;
      text-align: center;
    }

    button {
      background: #c9161d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gray {
      background: #333;
    }

    .green {
      background: #16883a;
    }

    .orange {
      background: #c46612;
    }
  </style>
</head>

<body>
  <h1>Timer Controller</h1>

  <div class="preview">
    <div class="preview-round" id="previewRound">ROUND 1</div>
    <div class="preview-time" id="previewTime">50:00</div>
  </div>

  <input id="roundInput" type="text" placeholder="ROUND 1 / TOP 8 / FINALS">
  <button onclick="setRound()">Set Round</button>

  <div class="row">
    <button class="green" onclick="startTimer()">Start</button>
    <button class="orange" onclick="pauseTimer()">Pause</button>
  </div>

  <button onclick="resetTimer()">Reset 50:00</button>

  <div class="row">
    <button class="gray" onclick="addMinute()">+1 Min</button>
    <button class="gray" onclick="subtractMinute()">-1 Min</button>
  </div>

  <input id="minutesInput" type="number" placeholder="Set minutes">
  <button class="gray" onclick="setMinutes()">Set Time</button>

  <script>
    let timeLeft = Number(localStorage.getItem("obsTimeLeft") || 3000);
    let timer = null;

    const previewRound = document.getElementById("previewRound");
    const previewTime = document.getElementById("previewTime");

    function saveState() {
      localStorage.setItem("obsTimeLeft", timeLeft);
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return minutes + ":" + secs.toString().padStart(2, "0");
    }

    function updatePreview() {
      const round = localStorage.getItem("obsRound") || "ROUND 1";
      previewRound.textContent = round;
      previewTime.textContent = formatTime(timeLeft);
      saveState();
    }

    function startTimer() {
      if (timer) return;

      timer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updatePreview();
        } else {
          pauseTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = 50 * 60;
      updatePreview();
    }

    function addMinute() {
      timeLeft += 60;
      updatePreview();
    }

    function subtractMinute() {
      timeLeft = Math.max(0, timeLeft - 60);
      updatePreview();
    }

    function setMinutes() {
      const mins = document.getElementById("minutesInput").value;

      if (mins !== "") {
        pauseTimer();
        timeLeft = Number(mins) * 60;
        updatePreview();
      }
    }

    function setRound() {
      const value = document.getElementById("roundInput").value.trim();

      if (value !== "") {
        localStorage.setItem("obsRound", value.toUpperCase());
        updatePreview();
      }
    }

    updatePreview();
  </script>
</body>
</html>
