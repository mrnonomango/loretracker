<!DOCTYPE html>
<html>
<head>
  <title>Round Timer Overlay</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .overlay {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30px;
      box-sizing: border-box;
    }

    .timer-box {
      background: rgba(20, 20, 20, 0.95);
      border: 3px solid #c9161d;
      border-radius: 20px;
      padding: 18px 55px 20px;
      min-width: 470px;
      text-align: center;
      box-shadow: 0 0 28px rgba(201, 22, 29, 0.45);
    }

    .round {
      color: white;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .time {
      color: white;
      font-size: 78px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 2px;
    }

    .warning {
      color: #ff3333;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="timer-box">
      <div class="round" id="roundText">ROUND 1</div>
      <div class="time" id="timerText">50:00</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
      databaseURL: "PASTE_YOUR_DATABASE_URL_HERE",
      projectId: "PASTE_YOUR_PROJECT_ID_HERE",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const timerRef = db.ref("roundTimer");

    const roundText = document.getElementById("roundText");
    const timerText = document.getElementById("timerText");

    function formatTime(seconds) {
      seconds = Number(seconds) || 0;

      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;

      return minutes + ":" + secs.toString().padStart(2, "0");
    }

    function draw(state) {
      if (!state) return;

      const round = state.round || "ROUND 1";
      const timeLeft = Number(state.timeLeft || 0);

      roundText.textContent = round;
      timerText.textContent = formatTime(timeLeft);

      if (timeLeft <= 300) {
        timerText.classList.add("warning");
      } else {
        timerText.classList.remove("warning");
      }
    }

    timerRef.on("value", function(snapshot) {
      const state = snapshot.val();

      if (!state) {
        timerRef.set({
          round: "ROUND 1",
          timeLeft: 3000,
          running: false
        });
        return;
      }

      draw(state);
    });
  </script>
</body>
</html>
