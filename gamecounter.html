<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Riftbound Game Counter Overlay</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}

.game-counter-wrapper {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 28px;
}

.player-games {
  display: flex;
  align-items: center;
  gap: 18px;
}

.game-orb {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #020611;
  border: 3px solid #d8b45a;
  box-sizing: border-box;
  box-shadow:
    0 0 10px rgba(216, 180, 90, 0.8);
}

.game-orb::after {
  content: "";
  position: absolute;
  left: -12px;
  right: -12px;
  top: 50%;
  height: 6px;
  transform: translateY(-50%);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(216, 180, 90, 0.95),
    transparent
  );
  z-index: -1;
}

.game-orb.won {
  background: #d8b45a;
  box-shadow:
    0 0 10px rgba(216, 180, 90, 1),
    0 0 24px rgba(216, 180, 90, 0.9);
}
</style>
</head>

<body>

<div class="overlay">

  <div class="game-counter-wrapper">

    <div class="player-games" id="p1Games">
      <div class="game-orb"></div>
      <div class="game-orb"></div>
    </div>

    <div class="player-games" id="p2Games">
      <div class="game-orb"></div>
      <div class="game-orb"></div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function updateGameOrbs(playerId, games) {
  const orbs = document
    .getElementById(playerId)
    .querySelectorAll(".game-orb");

  orbs.forEach((orb, index) => {
    orb.classList.toggle("won", index < games);
  });
}

onValue(ref(db, "riftbound/p1Games"), snapshot => {
  updateGameOrbs("p1Games", Number(snapshot.val()) || 0);
});

onValue(ref(db, "riftbound/p2Games"), snapshot => {
  updateGameOrbs("p2Games", Number(snapshot.val()) || 0);
});

updateGameOrbs("p1Games", 0);
updateGameOrbs("p2Games", 0);
</script>

</body>
</html>
