nsparent 25%,rgba(244,210,129,.04) 42%,rgba(255,222,149,.35) 50%,rgba(255,221,151,.05) 58%,transparent 75%);transform:translateX(-160%);opacity:0}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",authDomain:"lore-counter-4e654.firebaseapp.com",databaseURL:"https://lore-counter-4e654-default-rtdb.firebaseio.com",projectId:"lore-counter-4e654"});
const db=getDatabase(app);const data={};const $=id=>document.getElementById(id);
const previous={};
function paint(){
 for(let i=1;i<=2;i++){
  const p=data[i]||{},name=String(p.name??("Person "+i)),sub=String(p.subtitle??""),visible=p.visible!==false;
  const el=$("p"+i);
  const old=previous[i];
  $("n"+i).textContent=name;$("s"+i).textContent=sub;
  el.classList.toggle("hidden",!visible);
  if(visible&&old&&(old.visible===false||old.name!==name||old.subtitle!==sub)){
   el.classList.remove("reveal");void el.offsetWidth;el.classList.add("reveal");
  }
  previous[i]={name,subtitle:sub,visible};
 }
 $("plates").classList.toggle("solo",[1,2].filter(i=>data[i]?.visible!==false).length===1);
}
for(let i=1;i<=2;i++)onValue(ref(db,"interview/person"+i),snap=>{data[i]=snap.val()||{};paint()});
</script></body></html>
