<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
    }

    .side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 420px;
      display: flex;
      align-items: stretch;
    }

    .left {
      left: 0;
    }

    .right {
      right: 0;
      justify-content: flex-end;
    }

    /* =========================
       PANELS
    ========================== */

    .panel {
      width: 300px;
      height: 100%;
      position: relative;

      background:
        radial-gradient(circle at 50% 88%, rgba(255,120,0,0.20), rgba(255,120,0,0) 28%),
        radial-gradient(circle at 50% 100%, rgba(255,60,0,0.30), rgba(255,60,0,0) 38%),
        linear-gradient(
          180deg,
          #050505 0%,
          #101010 40%,
          #1a0d08 70%,
          #2a1200 100%
        );

      border: 2px solid #d89b2b;

      box-shadow:
        inset 0 0 30px rgba(255,120,0,.08),
        inset 0 0 60px rgba(0,0,0,.85);

      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 10px;

      border: 1px solid rgba(255,180,60,.35);

      pointer-events: none;
    }

    /* =========================
       LORE TRACK
    ========================== */

    .track {

      width: 92px;
      height: 100%;

      position: relative;

      background:
        linear-gradient(
          180deg,
          #050505 0%,
          #111111 40%,
          #1a1a1a 100%
        );

      overflow: hidden;

      border-left: 2px solid #d89b2b;
      border-right: 2px solid #d89b2b;

      box-shadow:
        inset 0 0 20px rgba(255,120,0,.08),
        inset 0 0 40px rgba(0,0,0,.95);
    }

    .track::before {

      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 8px;
      right: 8px;

      border-left: 1px solid rgba(255,180,60,.65);
      border-right: 1px solid rgba(255,180,60,.65);

      pointer-events: none;
    }

    .track::after {
      display: none;
    }

    /* =========================
       MARKERS
    ========================== */

    .markers {

      position: absolute;

      top: 34px;
      bottom: 34px;

      left: 0;
      right: 0;
    }

    .marker {

      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      width: 52px;
      height: 52px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 30%,
          #1e1e1e 0%,
          #0d0d0d 60%,
          #000000 100%
        );

      border: 3px solid #d89b2b;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-weight: bold;
      font-size: 18px;

      box-sizing: border-box;

      text-shadow:
        0 1px 3px rgba(0,0,0,.9);

      transition: .2s ease;
    }

    .marker.lit {

      background:
        radial-gradient(
          circle at 30% 30%,
          #2b2b2b 0%,
          #121212 60%,
          #000000 100%
        );

      border: 3px solid #d89b2b;

      color: #ffffff;
    }

    .marker.current {

      background:
        radial-gradient(
          circle at 30% 30%,
          #5a2b00 0%,
          #2b1200 45%,
          #000000 100%
        );

      border: 3px solid #ffb347;

      transform:
        translateX(-50%)
        scale(1.12);

      box-shadow:
        0 0 10px rgba(255,140,0,.95),
        0 0 24px rgba(255,90,0,.75),
        0 0 42px rgba(255,40,0,.45);

      animation: emberPulse 1.8s infinite;

      color: #ffffff;
    }

    @keyframes emberPulse {

      0%,100% {

        box-shadow:
          0 0 10px rgba(255,140,0,.95),
          0 0 24px rgba(255,90,0,.75),
          0 0 42px rgba(255,40,0,.45);
      }

      50% {

        box-shadow:
          0 0 18px rgba(255,180,60,1),
          0 0 36px rgba(255,100,0,.95),
          0 0 58px rgba(255,50,0,.65);
      }
    }

    /* =========================
       LOGO
    ========================== */

    .lorcana {

      position: absolute;

      bottom: 58px;

      width: 100%;

      text-align: center;

      color: #f5dfae;

      text-shadow:
        0 0 10px rgba(255,180,60,.25);

      letter-spacing: 1px;
    }

    .lorcana .disney {
      font-size: 24px;
      font-style: italic;
      margin-bottom: 4px;
    }

    .lorcana .main {
      font-size: 56px;
      font-weight: 800;
      line-height: .95;
    }

    .lorcana .sub {
      font-size: 20px;
      letter-spacing: 2px;
      margin-top: 6px;
    }

  </style>
</head>

<body>

<div class="overlay">

  <!-- LEFT -->

  <div class="side left">

    <div class="panel">

      <div class="lorcana">
        <div class="disney">Disney</div>
        <div class="main">LORCANA</div>
        <div class="sub">TRADING CARD GAME</div>
      </div>

    </div>

    <div class="track">

      <div class="markers" id="leftTrack"></div>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="side right">

    <div class="track">

      <div class="markers" id="rightTrack"></div>

    </div>

    <div class="panel">

      <div class="lorcana">
        <div class="disney">Disney</div>
        <div class="main">LORCANA</div>
        <div class="sub">TRADING CARD GAME</div>
      </div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
 onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const leftTrack = document.getElementById("leftTrack");
const rightTrack = document.getElementById("rightTrack");

const MAX = 20;

function render(el, val) {

  el.innerHTML = "";

  for (let i = MAX; i >= 0; i--) {

    const m = document.createElement("div");

    m.className = "marker";

    if (i <= val) {
      m.classList.add("lit");
    }

    if (i === val) {
      m.classList.add("current");
    }

    m.textContent = String(i);

    const pos =
      ((MAX - i) / MAX) * 100;

    m.style.top =
      `calc(${pos}% - 26px)`;

    el.appendChild(m);
  }
}

onValue(ref(db, "p1"), (s) => {
  render(leftTrack, Number(s.val()) || 0);
});

onValue(ref(db, "p2"), (s) => {
  render(rightTrack, Number(s.val()) || 0);
});

</script>

</body>
</html>
