const db = getDatabase(app);

const leftTrack = document.getElementById("leftTrack");
const rightTrack = document.getElementById("rightTrack");

const MAX = 20;

function render(el, val) {

  el.innerHTML = "";

  for (let i = MAX; i >= 0; i--) {

    const m = document.createElement("div");

    m.className = "marker";

    if (i <= val) {

    if (i === val) {

    const pos =
      ((MAX - i) / MAX) * 100;

    m.style.top =
      `calc(${pos}% - 26px)`;

    el.appendChild(m);
  }
}

onValue(ref(db, "p1"), (s) => {
  render(leftTrack, Number(s.val()) || 0);
});

onValue(ref(db, "p2"), (s) => {
  render(rightTrack, Number(s.val()) || 0);
});

</script>
