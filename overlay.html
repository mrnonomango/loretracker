<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
    }

    .side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 420px;
      display: flex;
      align-items: stretch;
    }

    .left {
      left: 0;
    }

    .right {
      right: 0;
      justify-content: flex-end;
    }


    /* =========================
       PANELS
       GOLD THEME
    ========================== */

    .panel {
      width: 300px;
      height: 100%;
      position: relative;

      box-sizing: border-box;

      background:
        radial-gradient(
          circle at 50% 88%,
          rgba(255, 238, 170, 0.20),
          rgba(255, 238, 170, 0) 32%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255, 204, 70, 0.18),
          rgba(255, 204, 70, 0) 45%
        ),
        linear-gradient(
          180deg,
          #f9d66d 0%,
          #f3c44f 32%,
          #eeb43a 68%,
          #d99724 100%
        );

      border: 2px solid #f8dc82;

      box-shadow:
        inset 0 0 30px rgba(255, 245, 190, .12),
        inset 0 0 70px rgba(128, 75, 0, .18),
        0 0 8px rgba(255, 210, 90, .18);

      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 10px;

      border:
        1px solid rgba(255, 243, 190, .50);

      pointer-events: none;
    }


    /* =========================
       LORE TRACK
       BLUE + GOLD
    ========================== */

    .track {
      width: 92px;
      height: 100%;

      position: relative;

      box-sizing: border-box;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(55, 145, 210, .18),
          rgba(55, 145, 210, 0) 58%
        ),
        linear-gradient(
          180deg,
          #214d78 0%,
          #123150 34%,
          #0b1e32 68%,
          #050c15 100%
        );

      overflow: hidden;

      border-left: 2px solid #f0c85b;
      border-right: 2px solid #f0c85b;

      box-shadow:
        inset 0 0 20px rgba(55, 145, 210, .12),
        inset 0 0 45px rgba(0, 0, 0, .90),
        0 0 5px rgba(240, 200, 91, .20);
    }

    .track::before {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 8px;
      right: 8px;

      border-left:
        1px solid rgba(240, 200, 91, .55);

      border-right:
        1px solid rgba(240, 200, 91, .55);

      pointer-events: none;
    }

    .track::after {
      display: none;
    }


    /* =========================
       MARKERS
    ========================== */

    .markers {
      position: absolute;

      top: 42px;
      bottom: 42px;

      left: 0;
      right: 0;
    }

    .marker {
      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      width: 52px;
      height: 52px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 30%,
          #16324b 0%,
          #0b1c2d 56%,
          #040a11 100%
        );

      border:
        3px solid #c9962d;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-weight: bold;
      font-size: 18px;

      box-sizing: border-box;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, .95);

      box-shadow:
        inset 0 0 8px rgba(65, 165, 225, .08),
        0 0 3px rgba(240, 200, 91, .10);

      transition: .2s ease;
    }


    /* =========================
       COMPLETED LORE
    ========================== */

    .marker.lit {
      background:
        radial-gradient(
          circle at 30% 30%,
          #245f8f 0%,
          #123b61 48%,
          #09243e 72%,
          #030b14 100%
        );

      border:
        3px solid #e1b447;

      box-shadow:
        0 0 6px rgba(218, 170, 55, .20),
        inset 0 0 12px rgba(70, 180, 235, .18);

      color: #ffffff;
    }


    /* =========================
       CURRENT LORE
       GOLD + BLUE WITH
       ICY CYAN GLOW
    ========================== */

    .marker.current {
      background:
        radial-gradient(
          circle at 30% 30%,
          #fffdf1 0%,
          #ffe9a0 20%,
          #e8b83f 40%,
          #2d8dbd 58%,
          #0c4269 75%,
          #03101e 100%
        );

      border:
        4px solid #dffcff;

      transform:
        translateX(-50%)
        scale(1.18);

      box-shadow:
        0 0 10px rgba(235, 255, 255, 1),
        0 0 22px rgba(140, 245, 255, .95),
        0 0 42px rgba(50, 205, 255, .85),
        0 0 68px rgba(0, 135, 255, .55),
        inset 0 0 14px rgba(230, 255, 255, .70);

      animation:
        lorePulse 1.2s infinite;

      color: #ffffff;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, .95),
        0 0 4px rgba(0, 0, 0, .65);

      z-index: 5;
    }


    @keyframes lorePulse {

      0%,
      100% {

        box-shadow:
          0 0 10px rgba(235, 255, 255, 1),
          0 0 22px rgba(140, 245, 255, .95),
          0 0 42px rgba(50, 205, 255, .85),
          0 0 68px rgba(0, 135, 255, .55),
          inset 0 0 14px rgba(230, 255, 255, .70);
      }

      50% {

        box-shadow:
          0 0 16px rgba(255, 255, 255, 1),
          0 0 34px rgba(175, 250, 255, 1),
          0 0 60px rgba(75, 220, 255, .95),
          0 0 92px rgba(0, 145, 255, .72),
          inset 0 0 20px rgba(235, 255, 255, .90);
      }
    }


    /* =========================
       LOGO
    ========================== */

    .lorcana {
      position: absolute;

      bottom: 58px;

      width: 100%;

      text-align: center;

      color: #fff7db;

      text-shadow:
        0 0 8px rgba(255, 245, 190, .28),
        0 2px 4px rgba(120, 65, 0, .72);

      letter-spacing: 1px;
    }

    .lorcana .disney {
      font-size: 24px;
      font-style: italic;
      margin-bottom: 4px;
    }

    .lorcana .main {
      font-size: 56px;
      font-weight: 800;
      line-height: .95;
    }

    .lorcana .sub {
      font-size: 20px;
      letter-spacing: 2px;
      margin-top: 6px;
    }

  </style>
</head>

<body>

<div class="overlay">

  <!-- =========================
       LEFT PLAYER
  ========================== -->

  <div class="side left">

    <div class="panel">

      <div class="lorcana">
        <div class="disney">Disney</div>
        <div class="main">LORCANA</div>
        <div class="sub">TRADING CARD GAME</div>
      </div>

    </div>

    <div class="track">

      <div
        class="markers"
        id="leftTrack">
      </div>

    </div>

  </div>


  <!-- =========================
       RIGHT PLAYER
  ========================== -->

  <div class="side right">

    <div class="track">

      <div
        class="markers"
        id="rightTrack">
      </div>

    </div>

    <div class="panel">

      <div class="lorcana">
        <div class="disney">Disney</div>
        <div class="main">LORCANA</div>
        <div class="sub">TRADING CARD GAME</div>
      </div>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


/* =========================
   FIREBASE
========================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================
   TRACKS
========================== */

const leftTrack =
  document.getElementById("leftTrack");

const rightTrack =
  document.getElementById("rightTrack");

const MAX = 20;


/* =========================
   RENDER LORE
========================== */

function render(el, val) {

  el.innerHTML = "";

  for (let i = MAX; i >= 0; i--) {

    const m =
      document.createElement("div");

    m.className = "marker";


    /* Completed lore */

    if (i <= val) {
      m.classList.add("lit");
    }


    /* Current lore */

    if (i === val) {
      m.classList.add("current");
    }


    m.textContent =
      String(i);


    /* Position lore marker */

    const pos =
      ((MAX - i) / MAX) * 100;

    m.style.top =
      `calc(${pos}% - 26px)`;


    el.appendChild(m);
  }
}


/* =========================
   PLAYER 1
========================== */

onValue(
  ref(db, "p1"),
  (s) => {

    render(
      leftTrack,
      Number(s.val()) || 0
    );

  }
);


/* =========================
   PLAYER 2
========================== */

onValue(
  ref(db, "p2"),
  (s) => {

    render(
      rightTrack,
      Number(s.val()) || 0
    );

  }
);

</script>

</body>
</html>
