<!DOCTYPE html>
<html>
<head>
  <title>Timer Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
">

<div id="time" style="
  font-size:180px;
  font-weight:bold;
  color:white;
  text-shadow:
    0 0 25px #4fc3ff,
    0 0 60px #2196f3;
">
  55:00
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const config = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(config);
const db = getDatabase(app);
const timerRef = ref(db, "timer");

let timerState = {
  remaining: 3300,
  running: false,
  startedAt: 0
};

function formatTime(totalSeconds) {
  const safe = Math.max(0, Number(totalSeconds) || 0);
  const minutes = Math.floor(safe / 60);
  const seconds = safe % 60;
  return `${minutes}:${String(seconds).padStart(2, "0")}`;
}

function computeRemaining() {
  const now = Date.now();
  let remaining = Number(timerState.remaining ?? 3300);
  const running = Boolean(timerState.running);
  const startedAt = Number(timerState.startedAt ?? 0);

  if (running && startedAt > 0) {
    const elapsed = Math.floor((now - startedAt) / 1000);
    remaining = Math.max(0, remaining - elapsed);
  }

  return remaining;
}

function render() {
  document.getElementById("time").textContent = formatTime(computeRemaining());
}

onValue(timerRef, (snap) => {
  timerState = snap.val() || {
    remaining: 3300,
    running: false,
    startedAt: 0
  };
  render();
});

setInterval(render, 250);
render();
</script>

</body>
</html>
