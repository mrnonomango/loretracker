<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body style="
  background:#111;
  color:white;
  font-family:Arial, sans-serif;
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
">

  <!-- TOP HALF / PLAYER 1 -->
  <div style="
    height:50vh;
    transform:rotate(180deg);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:6px;
    border-bottom:2px solid #333;
  ">
    <div style="font-size:14px;color:#aaa;">Opponent Lore</div>
    <div id="p2_top" style="font-size:48px;font-weight:bold;">0</div>

    <div style="text-align:center;margin:4px 0;">
      <div style="font-size:13px;color:#aaa;">Player 1</div>
      <div style="font-size:14px;color:#aaa;">YOUR LORE</div>
      <div id="p1" style="font-size:56px;font-weight:bold;">0</div>
    </div>

    <input id="p1NameInput" placeholder="Player 1 Name" style="
      padding:4px;
      font-size:14px;
      border-radius:8px;
      border:none;
      text-align:center;
      width:160px;
    ">

    <div style="display:flex;gap:6px;margin:5px 0;">
      <div id="p1g1" style="width:10px;height:10px;border:2px solid gold;border-radius:50%;"></div>
      <div id="p1g2" style="width:10px;height:10px;border:2px solid gold;border-radius:50%;"></div>
    </div>

    <div style="display:flex;gap:8px;">
      <button onclick="updateLore('p1',1)" style="font-size:40px;width:80px;height:80px;background:green;border:none;border-radius:16px;">+</button>
      <button onclick="updateLore('p1',-1)" style="font-size:40px;width:80px;height:80px;background:red;border:none;border-radius:16px;">−</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:6px;">
      <button onclick="addGameWin('p1')" style="font-size:18px;width:130px;height:48px;background:#d4af37;border:none;border-radius:12px;">+ Game P1</button>
      <button onclick="resetGames()" style="font-size:16px;width:130px;height:48px;background:#444;color:white;border:none;border-radius:12px;">Reset</button>
    </div>

    <button onclick="saveNames()" style="margin-top:6px;font-size:14px;width:150px;height:36px;background:#2f8f6b;border:none;border-radius:10px;">Save Names</button>
  </div>

  <!-- BOTTOM HALF / PLAYER 2 -->
  <div style="
    height:50vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:6px;
  ">
    <div style="font-size:14px;color:#aaa;">Opponent Lore</div>
    <div id="p1_bottom" style="font-size:48px;font-weight:bold;">0</div>

    <div style="text-align:center;margin:4px 0;">
      <div style="font-size:13px;color:#aaa;">Player 2</div>
      <div style="font-size:14px;color:#aaa;">YOUR LORE</div>
      <div id="p2" style="font-size:56px;font-weight:bold;">0</div>
    </div>

    <input id="p2NameInput" placeholder="Player 2 Name" style="
      padding:4px;
      font-size:14px;
      border-radius:8px;
      border:none;
      text-align:center;
      width:160px;
    ">

    <div style="display:flex;gap:6px;margin:5px 0;">
      <div id="p2g1" style="width:10px;height:10px;border:2px solid gold;border-radius:50%;"></div>
      <div id="p2g2" style="width:10px;height:10px;border:2px solid gold;border-radius:50%;"></div>
    </div>

    <div style="display:flex;gap:8px;">
      <button onclick="updateLore('p2',1)" style="font-size:40px;width:80px;height:80px;background:green;border:none;border-radius:16px;">+</button>
      <button onclick="updateLore('p2',-1)" style="font-size:40px;width:80px;height:80px;background:red;border:none;border-radius:16px;">−</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:6px;">
      <button onclick="addGameWin('p2')" style="font-size:18px;width:130px;height:48px;background:#d4af37;border:none;border-radius:12px;">+ Game P2</button>
      <button onclick="resetGames()" style="font-size:16px;width:130px;height:48px;background:#444;color:white;border:none;border-radius:12px;">Reset</button>
    </div>

    <button onclick="saveNames()" style="margin-top:6px;font-size:14px;width:150px;height:36px;background:#2f8f6b;border:none;border-radius:10px;">Save Names</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const p1Ref = ref(db, "p1");
const p2Ref = ref(db, "p2");
const p1GamesRef = ref(db, "p1Games");
const p2GamesRef = ref(db, "p2Games");
const p1NameRef = ref(db, "p1Name");
const p2NameRef = ref(db, "p2Name");

function renderDots(player, wins) {
  document.getElementById(player + "g1").style.background = wins >= 1 ? "gold" : "transparent";
  document.getElementById(player + "g2").style.background = wins >= 2 ? "gold" : "transparent";
}

onValue(p1Ref, snap => {
  let v = snap.val() || 0;
  p1.innerText = v;
  p1_bottom.innerText = v;
});

onValue(p2Ref, snap => {
  let v = snap.val() || 0;
  p2.innerText = v;
  p2_top.innerText = v;
});

onValue(p1GamesRef, snap => renderDots("p1", snap.val() || 0));
onValue(p2GamesRef, snap => renderDots("p2", snap.val() || 0));

onValue(p1NameRef, s => p1NameInput.value = s.val() || "");
onValue(p2NameRef, s => p2NameInput.value = s.val() || "");

window.updateLore = async (p,c)=>{
  let r = p==="p1"?p1Ref:p2Ref;
  let v = (await get(r)).val()||0;
  v = Math.max(0,Math.min(20,v+c));
  set(r,v);
};

window.addGameWin = async p=>{
  let r = p==="p1"?p1GamesRef:p2GamesRef;
  let v = (await get(r)).val()||0;
  set(r,Math.min(2,v+1));
};

window.resetGames = ()=>{
  set(p1GamesRef,0);
  set(p2GamesRef,0);
};

window.saveNames = ()=>{
  set(p1NameRef,p1NameInput.value);
  set(p2NameRef,p2NameInput.value);
};
</script>

</body>
</html>
