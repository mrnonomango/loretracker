<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body style="
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
">

  <!-- TOP HALF / PLAYER 1 -->
  <div style="
    height:50vh;
    transform:rotate(180deg);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding-top:8px;
    box-sizing:border-box;
    border-bottom:2px solid #333;
  ">

    <div style="font-size:12px;color:#aaa;line-height:1;">
      Opponent Lore
    </div>

    <div id="p2_top" style="
      font-size:34px;
      font-weight:bold;
      line-height:1;
      margin-top:2px;
    ">
      0
    </div>

    <div style="text-align:center;margin:2px 0;">
      <div style="font-size:12px;color:#aaa;line-height:1;">
        Player 1
      </div>

      <div style="font-size:12px;color:#aaa;line-height:1;">
        YOUR LORE
      </div>

      <div id="p1" style="
        font-size:44px;
        font-weight:bold;
        line-height:1;
      ">
        0
      </div>
    </div>

    <!-- NAME -->
    <div style="transform:rotate(180deg);margin-top:2px;">
      <input id="p1NameInput"
        placeholder="Player 1 Name"
        style="
          padding:3px;
          font-size:12px;
          border-radius:7px;
          border:none;
          text-align:center;
          width:145px;
          height:22px;
          box-sizing:border-box;
        ">
    </div>

    <!-- GAME DOTS -->
    <div style="
      display:flex;
      gap:5px;
      margin:4px 0;
    ">
      <div id="p1g1" style="
        width:9px;
        height:9px;
        border:2px solid gold;
        border-radius:50%;
      "></div>

      <div id="p1g2" style="
        width:9px;
        height:9px;
        border:2px solid gold;
        border-radius:50%;
      "></div>
    </div>

    <!-- + - -->
    <div style="
      display:flex;
      gap:8px;
    ">
      <button onclick="updateLore('p1',1)" style="
        font-size:36px;
        width:68px;
        height:68px;
        background:green;
        color:white;
        border:none;
        border-radius:14px;
      ">
        +
      </button>

      <button onclick="updateLore('p1',-1)" style="
        font-size:36px;
        width:68px;
        height:68px;
        background:red;
        color:white;
        border:none;
        border-radius:14px;
      ">
        −
      </button>
    </div>

    <!-- HOLD RESET -->
    <button
      id="loreResetBtn1"
      ontouchstart="startLoreReset('loreResetBtn1')"
      ontouchend="cancelLoreReset('loreResetBtn1')"
      onmousedown="startLoreReset('loreResetBtn1')"
      onmouseup="cancelLoreReset('loreResetBtn1')"
      onmouseleave="cancelLoreReset('loreResetBtn1')"
      style="
        margin-top:4px;
        font-size:12px;
        width:145px;
        height:30px;
        background:#555;
        color:white;
        border:none;
        border-radius:10px;
        font-weight:bold;
        transition:0.2s;
      ">
      Hold To Reset Lore
    </button>

    <!-- GAME BUTTONS -->
    <div style="
      display:flex;
      gap:6px;
      margin-top:4px;
    ">
      <button onclick="addGameWin('p1')" style="
        font-size:14px;
        width:112px;
        height:34px;
        background:#d4af37;
        color:black;
        border:none;
        border-radius:10px;
        font-weight:bold;
      ">
        + Game P1
      </button>

      <button onclick="resetGames()" style="
        font-size:13px;
        width:112px;
        height:34px;
        background:#444;
        color:white;
        border:none;
        border-radius:10px;
        font-weight:bold;
      ">
        Game Reset
      </button>
    </div>
  </div>

  <!-- BOTTOM HALF / PLAYER 2 -->
  <div style="
    height:50vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding-top:8px;
    box-sizing:border-box;
  ">

    <div style="font-size:12px;color:#aaa;line-height:1;">
      Opponent Lore
    </div>

    <div id="p1_bottom" style="
      font-size:34px;
      font-weight:bold;
      line-height:1;
      margin-top:2px;
    ">
      0
    </div>

    <div style="text-align:center;margin:2px 0;">
      <div style="font-size:12px;color:#aaa;line-height:1;">
        Player 2
      </div>

      <div style="font-size:12px;color:#aaa;line-height:1;">
        YOUR LORE
      </div>

      <div id="p2" style="
        font-size:44px;
        font-weight:bold;
        line-height:1;
      ">
        0
      </div>
    </div>

    <!-- NAME -->
    <input id="p2NameInput"
      placeholder="Player 2 Name"
      style="
        padding:3px;
        font-size:12px;
        border-radius:7px;
        border:none;
        text-align:center;
        width:145px;
        height:22px;
        box-sizing:border-box;
      ">

    <!-- GAME DOTS -->
    <div style="
      display:flex;
      gap:5px;
      margin:4px 0;
    ">
      <div id="p2g1" style="
        width:9px;
        height:9px;
        border:2px solid gold;
        border-radius:50%;
      "></div>

      <div id="p2g2" style="
        width:9px;
        height:9px;
        border:2px solid gold;
        border-radius:50%;
      "></div>
    </div>

    <!-- + - -->
    <div style="
      display:flex;
      gap:8px;
    ">
      <button onclick="updateLore('p2',1)" style="
        font-size:36px;
        width:68px;
        height:68px;
        background:green;
        color:white;
        border:none;
        border-radius:14px;
      ">
        +
      </button>

      <button onclick="updateLore('p2',-1)" style="
        font-size:36px;
        width:68px;
        height:68px;
        background:red;
        color:white;
        border:none;
        border-radius:14px;
      ">
        −
      </button>
    </div>

    <!-- HOLD RESET -->
    <button
      id="loreResetBtn2"
      ontouchstart="startLoreReset('loreResetBtn2')"
      ontouchend="cancelLoreReset('loreResetBtn2')"
      onmousedown="startLoreReset('loreResetBtn2')"
      onmouseup="cancelLoreReset('loreResetBtn2')"
      onmouseleave="cancelLoreReset('loreResetBtn2')"
      style="
        margin-top:4px;
        font-size:12px;
        width:145px;
        height:30px;
        background:#555;
        color:white;
        border:none;
        border-radius:10px;
        font-weight:bold;
        transition:0.2s;
      ">
      Hold To Reset Lore
    </button>

    <!-- GAME BUTTONS -->
    <div style="
      display:flex;
      gap:6px;
      margin-top:4px;
    ">
      <button onclick="addGameWin('p2')" style="
        font-size:14px;
        width:112px;
        height:34px;
        background:#d4af37;
        color:black;
        border:none;
        border-radius:10px;
        font-weight:bold;
      ">
        + Game P2
      </button>

      <button onclick="resetGames()" style="
        font-size:13px;
        width:112px;
        height:34px;
        background:#444;
        color:white;
        border:none;
        border-radius:10px;
        font-weight:bold;
      ">
        Game Reset
      </button>
    </div>

    <!-- SAVE -->
    <button onclick="saveNames()" style="
      margin-top:5px;
      font-size:14px;
      width:155px;
      height:32px;
      background:#2f8f6b;
      color:white;
      border:none;
      border-radius:10px;
      font-weight:bold;
    ">
      Save Names
    </button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const p1Ref = ref(db, "p1");
const p2Ref = ref(db, "p2");

const p1GamesRef = ref(db, "p1Games");
const p2GamesRef = ref(db, "p2Games");

const p1NameRef = ref(db, "p1Name");
const p2NameRef = ref(db, "p2Name");

let loreResetTimer;

function renderDots(player, wins) {
  document.getElementById(player + "g1").style.background =
    wins >= 1 ? "gold" : "transparent";

  document.getElementById(player + "g2").style.background =
    wins >= 2 ? "gold" : "transparent";
}

onValue(p1Ref, snap => {
  const v = snap.val() || 0;

  document.getElementById("p1").innerText = v;
  document.getElementById("p1_bottom").innerText = v;
});

onValue(p2Ref, snap => {
  const v = snap.val() || 0;

  document.getElementById("p2").innerText = v;
  document.getElementById("p2_top").innerText = v;
});

onValue(p1GamesRef, snap => {
  renderDots("p1", snap.val() || 0);
});

onValue(p2GamesRef, snap => {
  renderDots("p2", snap.val() || 0);
});

onValue(p1NameRef, snap => {
  document.getElementById("p1NameInput").value =
    snap.val() || "";
});

onValue(p2NameRef, snap => {
  document.getElementById("p2NameInput").value =
    snap.val() || "";
});

window.updateLore = async (player, change) => {
  const r = player === "p1"
    ? p1Ref
    : p2Ref;

  let v = (await get(r)).val() || 0;

  v = Math.max(0, Math.min(20, v + change));

  set(r, v);
};

window.addGameWin = async player => {
  const r = player === "p1"
    ? p1GamesRef
    : p2GamesRef;

  let v = (await get(r)).val() || 0;

  set(r, Math.min(2, v + 1));
};

window.resetGames = () => {
  set(p1GamesRef, 0);
  set(p2GamesRef, 0);
};

window.startLoreReset = (buttonId) => {

  const btn = document.getElementById(buttonId);

  btn.innerText = "Resetting...";
  btn.style.background = "#b22222";

  loreResetTimer = setTimeout(() => {

    set(p1Ref, 0);
    set(p2Ref, 0);

    btn.innerText = "Lore Reset";
    btn.style.background = "#2e8b57";

    setTimeout(() => {
      btn.innerText = "Hold To Reset Lore";
      btn.style.background = "#555";
    }, 1000);

  }, 1500);
};

window.cancelLoreReset = (buttonId) => {

  clearTimeout(loreResetTimer);

  const btn = document.getElementById(buttonId);

  btn.innerText = "Hold To Reset Lore";
  btn.style.background = "#555";
};

window.saveNames = () => {
  set(
    p1NameRef,
    document.getElementById("p1NameInput").value
  );

  set(
    p2NameRef,
    document.getElementById("p2NameInput").value
  );
};
</script>

</body>
</html>
