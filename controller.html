<!DOCTYPE html>
<html>
<head>
  <title>Lorcana Controller</title>

  <meta name="viewport" content="
    width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no
  ">

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    body{
      margin:0;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#111;
      color:white;
      font-family:Arial, sans-serif;
      display:flex;
      flex-direction:column;
      touch-action:manipulation;
    }

    .playerHalf{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:3px 6px;
      gap:1px;
    }

    .topHalf{
      transform:rotate(180deg);
      border-bottom:2px solid #333;
    }

    .roundTimerBox{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:1px;
      padding:3px 10px;
      border:2px solid #555;
      border-radius:10px;
      background:#181818;
    }

    .roundTimerName{
      font-size:14px;
      font-weight:bold;
      color:#ddd;
      white-space:nowrap;
    }

    .roundTimerTime{
      font-size:25px;
      font-weight:bold;
      color:white;
      line-height:1;
    }

    .smallText{
      font-size:11px;
      color:#aaa;
      line-height:1;
    }

    .playerLabel{
      font-size:11px;
      color:#aaa;
      line-height:1;
    }

    .loreNumber{
      font-size:66px;
      font-weight:bold;
      line-height:0.95;
      color:white;
    }

    .yourLore{
      text-shadow:
        0 0 7px rgba(0,140,255,0.95),
        0 0 17px rgba(0,140,255,0.70),
        0 0 30px rgba(0,90,255,0.45);
    }

    .opponentLore{
      text-shadow:
        0 0 7px rgba(255,0,0,0.95),
        0 0 17px rgba(255,0,0,0.70),
        0 0 30px rgba(180,0,0,0.45);
    }

    .nameInput{
      width:190px;
      height:34px;
      padding:4px;
      font-size:16px;
      border:none;
      border-radius:8px;
      text-align:center;
      background:white;
      color:black;
    }

    .gameDots{
      display:flex;
      gap:5px;
      margin:1px 0;
    }

    .dot{
      width:11px;
      height:11px;
      border:2px solid gold;
      border-radius:50%;
      background:transparent;
    }

    .buttonRow{
      display:flex;
      gap:8px;
    }

    .loreButton{
      width:80px;
      height:70px;
      border:none;
      border-radius:14px;
      font-size:36px;
      color:white;
      font-weight:bold;
    }

    .plusBtn{
      background:green;
    }

    .minusBtn{
      background:red;
    }

    .resetLoreBtn{
      width:190px;
      height:36px;
      border:none;
      border-radius:10px;
      background:#7a2020;
      color:white;
      font-size:12px;
      font-weight:bold;
      margin-top:1px;
      position:relative;
      overflow:hidden;
      flex-shrink:0;
    }

    .resetFill{
      position:absolute;
      left:0;
      top:0;
      height:100%;
      width:0%;
      background:rgba(255,255,255,0.25);
      transition:none;
      z-index:1;
    }

    .resetText{
      position:relative;
      z-index:2;
    }

    .gameButtonRow{
      display:flex;
      gap:6px;
      margin-top:1px;
      flex-shrink:0;
    }

    .gameBtn{
      width:128px;
      height:38px;
      border:none;
      border-radius:10px;
      font-size:14px;
      font-weight:bold;
      color:white;
    }

    .goldBtn{
      background:#d4af37;
      color:black;
    }

    .resetBtn{
      background:#444;
      color:white;
    }
  </style>
</head>

<body>

  <!-- TOP PLAYER -->
  <div class="playerHalf topHalf">

    <div class="roundTimerBox">
      <div id="roundNameTop" class="roundTimerName">Round 1</div>
      <div id="roundTimeTop" class="roundTimerTime">55:00</div>
    </div>

    <div class="smallText">Opponent Lore</div>

    <div id="p1_top" class="loreNumber opponentLore">0</div>

    <div style="text-align:center;">

      <div class="playerLabel">Player 2</div>

      <div class="smallText">YOUR LORE</div>

      <div id="p2" class="loreNumber yourLore">0</div>

    </div>

    <input
      id="p2NameInput"
      class="nameInput"
      value="Player 2"
      style="transform:rotate(180deg);"
    >

    <div class="gameDots">
      <div id="p2g1" class="dot"></div>
      <div id="p2g2" class="dot"></div>
    </div>

    <div class="buttonRow">

      <button class="loreButton minusBtn" onclick="updateLore('p2',-1)">
        -
      </button>

      <button class="loreButton plusBtn" onclick="updateLore('p2',1)">
        +
      </button>

    </div>

    <button
      class="resetLoreBtn"
      onmousedown="startResetHold()"
      onmouseup="cancelResetHold()"
      onmouseleave="cancelResetHold()"
      ontouchstart="startResetHold()"
      ontouchend="cancelResetHold()"
    >

      <div class="resetFill" id="resetFill1"></div>

      <span class="resetText" id="resetText1">
        Hold To Reset Lore
      </span>

    </button>

    <div class="gameButtonRow">

      <button class="gameBtn goldBtn" onclick="addGameWin('p2')">
        + Game P2
      </button>

      <button class="gameBtn resetBtn" onclick="resetGames()">
        Reset Games
      </button>

    </div>

  </div>

  <!-- BOTTOM PLAYER -->
  <div class="playerHalf">

    <div class="roundTimerBox">
      <div id="roundNameBottom" class="roundTimerName">Round 1</div>
      <div id="roundTimeBottom" class="roundTimerTime">55:00</div>
    </div>

    <div class="smallText">Opponent Lore</div>

    <div id="p2_bottom" class="loreNumber opponentLore">0</div>

    <div style="text-align:center;">

      <div class="playerLabel">Player 1</div>

      <div class="smallText">YOUR LORE</div>

      <div id="p1" class="loreNumber yourLore">0</div>

    </div>

    <input
      id="p1NameInput"
      class="nameInput"
      value="Player 1"
    >

    <div class="gameDots">
      <div id="p1g1" class="dot"></div>
      <div id="p1g2" class="dot"></div>
    </div>

    <div class="buttonRow">

      <button class="loreButton minusBtn" onclick="updateLore('p1',-1)">
        -
      </button>

      <button class="loreButton plusBtn" onclick="updateLore('p1',1)">
        +
      </button>

    </div>

    <button
      class="resetLoreBtn"
      onmousedown="startResetHold()"
      onmouseup="cancelResetHold()"
      onmouseleave="cancelResetHold()"
      ontouchstart="startResetHold()"
      ontouchend="cancelResetHold()"
    >

      <div class="resetFill" id="resetFill2"></div>

      <span class="resetText" id="resetText2">
        Hold To Reset Lore
      </span>

    </button>

    <div class="gameButtonRow">

      <button class="gameBtn goldBtn" onclick="addGameWin('p1')">
        + Game P1
      </button>

      <button class="gameBtn resetBtn" onclick="resetGames()">
        Reset Games
      </button>

    </div>

  </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


const p1Ref = ref(db, "p1");
const p2Ref = ref(db, "p2");

const p1GamesRef = ref(db, "p1Games");
const p2GamesRef = ref(db, "p2Games");

const p1NameRef = ref(db, "p1Name");
const p2NameRef = ref(db, "p2Name");

const timerRef = ref(db, "timer");


const DEFAULT_RESET = 3300;
const DEFAULT_ROUND_NAME = "Round 1";


let timerData = {
  roundName: DEFAULT_ROUND_NAME,
  remaining: DEFAULT_RESET,
  running: false,
  startedAt: 0
};


let resetTimer;
let fillInterval;


/* ----------------------------
   ROUND TIMER
----------------------------- */

function formatTime(totalSeconds){

  const safe = Math.max(
    0,
    Math.floor(Number(totalSeconds) || 0)
  );

  const minutes = Math.floor(safe / 60);
  const seconds = safe % 60;

  return `${minutes}:${String(seconds).padStart(2,"0")}`;
}


function getTimerRemaining(){

  let remaining =
    Number(timerData.remaining ?? DEFAULT_RESET);

  const running =
    Boolean(timerData.running);

  const startedAt =
    Number(timerData.startedAt ?? 0);

  if(running && startedAt > 0){

    const elapsed =
      Math.floor((Date.now() - startedAt) / 1000);

    remaining =
      Math.max(0, remaining - elapsed);
  }

  return remaining;
}


function renderRoundTimer(){

  const remaining = getTimerRemaining();

  const formatted = formatTime(remaining);

  const roundName =
    timerData.roundName || DEFAULT_ROUND_NAME;

  document.getElementById("roundTimeTop").textContent =
    formatted;

  document.getElementById("roundTimeBottom").textContent =
    formatted;

  document.getElementById("roundNameTop").textContent =
    roundName;

  document.getElementById("roundNameBottom").textContent =
    roundName;
}


onValue(timerRef, snap => {

  timerData = snap.val() || {
    roundName: DEFAULT_ROUND_NAME,
    remaining: DEFAULT_RESET,
    running: false,
    startedAt: 0
  };

  renderRoundTimer();
});


setInterval(() => {

  renderRoundTimer();

}, 250);


/* ----------------------------
   GAME WIN DOTS
----------------------------- */

function renderDots(player, wins){

  document.getElementById(player + "g1").style.background =
    wins >= 1 ? "gold" : "transparent";

  document.getElementById(player + "g2").style.background =
    wins >= 2 ? "gold" : "transparent";
}


/* ----------------------------
   LORE LISTENERS
----------------------------- */

onValue(p1Ref, snap => {

  const v = snap.val() || 0;

  document.getElementById("p1").innerText = v;
  document.getElementById("p1_top").innerText = v;
});


onValue(p2Ref, snap => {

  const v = snap.val() || 0;

  document.getElementById("p2").innerText = v;
  document.getElementById("p2_bottom").innerText = v;
});


onValue(p1GamesRef, snap => {

  renderDots("p1", snap.val() || 0);

});


onValue(p2GamesRef, snap => {

  renderDots("p2", snap.val() || 0);

});


/* ----------------------------
   PLAYER NAME AUTO SAVE
----------------------------- */

const p1NameInput =
  document.getElementById("p1NameInput");

const p2NameInput =
  document.getElementById("p2NameInput");


onValue(p1NameRef, snap => {

  const name =
    String(snap.val() || "").trim() || "Player 1";

  if(document.activeElement !== p1NameInput){
    p1NameInput.value = name;
  }

});


onValue(p2NameRef, snap => {

  const name =
    String(snap.val() || "").trim() || "Player 2";

  if(document.activeElement !== p2NameInput){
    p2NameInput.value = name;
  }

});


async function savePlayerName(input, nameRef, defaultName){

  let name = input.value.trim();

  if(!name){
    name = defaultName;
  }

  input.value = name;

  await set(nameRef, name);
}


p1NameInput.addEventListener("blur", () => {

  savePlayerName(
    p1NameInput,
    p1NameRef,
    "Player 1"
  );

});


p2NameInput.addEventListener("blur", () => {

  savePlayerName(
    p2NameInput,
    p2NameRef,
    "Player 2"
  );

});


p1NameInput.addEventListener("keydown", event => {

  if(event.key === "Enter"){

    event.preventDefault();
    p1NameInput.blur();

  }

});


p2NameInput.addEventListener("keydown", event => {

  if(event.key === "Enter"){

    event.preventDefault();
    p2NameInput.blur();

  }

});


/* ----------------------------
   LORE BUTTONS
----------------------------- */

window.updateLore = async (p,c) => {

  const r =
    p === "p1"
      ? p1Ref
      : p2Ref;

  let v =
    (await get(r)).val() || 0;

  v =
    Math.max(
      0,
      Math.min(20, v + c)
    );

  set(r, v);
};


/* ----------------------------
   HOLD TO RESET LORE
----------------------------- */

window.startResetHold = () => {

  let progress = 0;

  document.getElementById("resetText1").innerText =
    "Resetting...";

  document.getElementById("resetText2").innerText =
    "Resetting...";

  fillInterval = setInterval(() => {

    progress += 3;

    document.getElementById("resetFill1").style.width =
      progress + "%";

    document.getElementById("resetFill2").style.width =
      progress + "%";

  }, 30);


  resetTimer = setTimeout(() => {

    set(p1Ref, 0);
    set(p2Ref, 0);

    resetButtons();

  }, 1000);
};


window.cancelResetHold = () => {

  clearTimeout(resetTimer);
  clearInterval(fillInterval);

  resetButtons();
};


function resetButtons(){

  document.getElementById("resetFill1").style.width =
    "0%";

  document.getElementById("resetFill2").style.width =
    "0%";

  document.getElementById("resetText1").innerText =
    "Hold To Reset Lore";

  document.getElementById("resetText2").innerText =
    "Hold To Reset Lore";
}


/* ----------------------------
   GAME WINS
----------------------------- */

window.addGameWin = async p => {

  const r =
    p === "p1"
      ? p1GamesRef
      : p2GamesRef;

  let v =
    (await get(r)).val() || 0;

  set(
    r,
    Math.min(2, v + 1)
  );
};


window.resetGames = () => {

  set(p1GamesRef, 0);
  set(p2GamesRef, 0);

};

</script>

</body>
</html>
