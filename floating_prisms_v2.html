<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lorcana Cookout — Floating Prisms V2</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#060c19;color:#e8eaf1;font-family:Arial,sans-serif}
main{max-width:1450px;margin:auto;padding:16px 18px 24px}
h1{font-size:21px;margin:2px 0 7px;color:#f5d292}p{color:#aebdd4;font-size:13px;margin:0 0 15px;line-height:1.5}
#stage{width:100%;aspect-ratio:16/9;position:relative;background:#081124;border:1px solid #735d58;border-radius:9px;overflow:hidden}
#stage canvas{width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 51% 47%,transparent 36%,#02071259 100%);pointer-events:none}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:25px;background:#111b32;color:#fff;text-align:center}
#controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{border:1px solid #ac8551;background:#1a2b46;color:#f5d292;padding:11px 16px;border-radius:7px;cursor:pointer;font-weight:700}
#state{font-size:12px;color:#9caec9}
#stage:fullscreen{border:0;border-radius:0}
</style></head><body>
<main><h1>THE LORCANA COOKOUT — FLOATING PRISMS V2</h1>
<p>Pure cinematic background. No baked-in text, logo, or timer. Slow moving 3D prisms with a looping 24-second camera movement.</p>
<div id="stage" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
<canvas id="scene" width="1920" height="1080"></canvas><div id="vignette"></div>
<div id="err">3D rendering did not load. Please reload in Chrome.</div></div>
<div id="controls"><button id="toggle">Pause motion</button><button id="restart">Restart loop</button><button id="fullscreen">Full screen</button><span id="state">24-second seamless motion loop · 1920 × 1080 · Test version</span></div></main>
<script>
(()=>{
if(!window.THREE||!window.gsap){document.getElementById("err").style.display="flex";return}
const THREE=window.THREE,gsap=window.gsap;
const canvas=document.getElementById("scene");let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:"high-performance"});}
catch(e){document.getElementById("err").style.display="flex";return}
renderer.setSize(1920,1080,false);renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.32;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070e21);
scene.fog=new THREE.FogExp2(0x081026,.013);
const camera=new THREE.PerspectiveCamera(56,1920/1080,.1,260);
scene.add(new THREE.AmbientLight(0x668bc4,1.7));
const hemi=new THREE.HemisphereLight(0x9fb7dc,0x0a0b14,1.05);scene.add(hemi);
const warm=new THREE.PointLight(0xffce80,600,120,1.2);warm.position.set(-11,9,-24);scene.add(warm);
const cool=new THREE.PointLight(0x568fe3,570,130,1.2);cool.position.set(12,4,-36);scene.add(cool);
const rim=new THREE.DirectionalLight(0xd6e2ff,1.65);rim.position.set(3,13,-15);scene.add(rim);
const gold=new THREE.MeshStandardMaterial({color:0xc79a59,metalness:.75,roughness:.27});
const darkGold=new THREE.MeshStandardMaterial({color:0x785331,metalness:.78,roughness:.32});
const navy=new THREE.MeshStandardMaterial({color:0x274b7c,metalness:.76,roughness:.28});
const darkBlue=new THREE.MeshStandardMaterial({color:0x112743,metalness:.72,roughness:.34});
const brightGold=new THREE.MeshStandardMaterial({color:0xf2d49a,metalness:.56,roughness:.29});
const edgeBlue=new THREE.MeshStandardMaterial({color:0x547db2,metalness:.66,roughness:.32});
const prisms=[];
function prism({x,y,z,w,h,d,rot,mat,trim,phase,bob=.22}){
 const group=new THREE.Group();group.position.set(x,y,z);
 const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 group.add(body);
 // A narrow real three-dimensional bevel on one surface; no flat overlay stripes.
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.085,h*.93,d*1.025),trim);
 edge.position.x=-w/2+.12;group.add(edge);
 const side=new THREE.Mesh(new THREE.BoxGeometry(w*.08,h*.98,d*1.06),mat===gold||mat===darkGold?darkGold:darkBlue);
 side.position.x=w/2-.065;group.add(side);
 group.rotation.set(.05,rot,.09);
 scene.add(group);prisms.push({group,x,y,z,rot,phase,bob});
}
[
 {x:-11.2,y:1.7,z:-13,w:3.4,h:18,d:3.0,rot:.28,mat:gold,trim:brightGold,phase:.4,bob:.22},
 {x:11.5,y:1.0,z:-19,w:3.7,h:20,d:3.6,rot:-.31,mat:navy,trim:edgeBlue,phase:1.8,bob:.26},
 {x:-8.6,y:-2.7,z:-33,w:3.1,h:14,d:3.6,rot:.39,mat:darkGold,trim:gold,phase:2.6,bob:.3},
 {x:8.8,y:4.3,z:-39,w:3.9,h:18,d:4.1,rot:-.35,mat:navy,trim:edgeBlue,phase:4.1,bob:.25},
 {x:-13.2,y:3.0,z:-55,w:5.2,h:22,d:5.6,rot:.24,mat:gold,trim:brightGold,phase:1.1,bob:.2},
 {x:12.8,y:-1.7,z:-61,w:4.8,h:19,d:5.1,rot:-.3,mat:darkBlue,trim:edgeBlue,phase:3.2,bob:.23},
 {x:-6.5,y:5.3,z:-74,w:2.9,h:13,d:3.8,rot:.45,mat:darkGold,trim:gold,phase:5.5,bob:.32},
 {x:7.0,y:-3.4,z:-81,w:3.6,h:15,d:4.4,rot:-.35,mat:navy,trim:edgeBlue,phase:.8,bob:.25},
 {x:-12.8,y:-2,z:-102,w:4.5,h:22,d:4.0,rot:.22,mat:gold,trim:brightGold,phase:3.7,bob:.26},
 {x:12.7,y:3.2,z:-112,w:4.5,h:20,d:5.2,rot:-.29,mat:darkBlue,trim:edgeBlue,phase:4.8,bob:.25}
].forEach(prism);
// Sparse, offset smaller pieces add depth without visual clutter.
[
 [-3.8,8.5,-37,1.1,6,1.2,gold,brightGold],
 [4.1,-8.3,-51,1.2,5,1.4,navy,edgeBlue],
 [-4.3,-8,-86,1.5,7,1.5,darkGold,gold],
 [3.8,8.2,-94,1.5,6,1.8,darkBlue,edgeBlue]
].forEach((p,i)=>prism({x:p[0],y:p[1],z:p[2],w:p[3],h:p[4],d:p[5],rot:i%2?.4:-.4,mat:p[6],trim:p[7],phase:i*1.5,bob:.18}));
const motion={time:0};const TWO_PI=Math.PI*2;
function render(){
 const t=motion.time,ang=TWO_PI*t/24;
 camera.position.set(1.15*Math.sin(ang-.25),1.65+.38*Math.sin(ang+1.2),13.6+2.3*Math.sin(ang-.45));
 camera.lookAt(.6*Math.sin(ang+.35),.25+.25*Math.sin(ang-.5),-36);
 camera.rotateZ(.006*Math.sin(ang+1.1));
 for(const p of prisms){
  p.group.position.set(p.x+.25*Math.sin(ang+p.phase),p.y+p.bob*Math.sin(ang+p.phase),p.z+1.6*Math.sin(ang+p.phase*.4));
  p.group.rotation.y=p.rot+.025*Math.sin(ang+p.phase);
  p.group.rotation.z=.02*Math.sin(ang+p.phase*.75);
 }
 warm.position.x=-11+2.0*Math.sin(ang);cool.position.x=12+1.6*Math.cos(ang);
 renderer.render(scene,camera);
}
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true,repeat:-1,onUpdate:render});
tl.to(motion,{time:24,duration:24,ease:"none"},0);
window.__timelines.main=tl;render();
const toggle=document.getElementById("toggle");
toggle.addEventListener("click",()=>{if(tl.paused()){tl.play();toggle.textContent="Pause motion"}else{tl.pause();toggle.textContent="Play motion"}});
document.getElementById("restart").addEventListener("click",()=>{tl.restart();toggle.textContent="Pause motion"});
document.getElementById("fullscreen").addEventListener("click",()=>document.getElementById("stage").requestFullscreen?.());
if(window.location.search.includes("render=")||window.parent!==window){
 document.querySelector("main>h1").style.display="none";document.querySelector("main>p").style.display="none";document.getElementById("controls").style.display="none";
 document.querySelector("main").style.cssText="padding:0;max-width:none";
 document.getElementById("stage").style.cssText="border:0;border-radius:0;width:1920px;height:1080px";
}else{tl.play()}
})();
</script></body></html>
