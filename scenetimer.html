<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorcana Round Timer Only</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.timer-box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:transparent;border:none;box-shadow:none;padding:0;margin:0}
.round-name,.time{color:white;font-weight:bold;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.45)}
.round-name{font-size:30px;line-height:1.05;max-width:500px;overflow:hidden;text-overflow:ellipsis}
.time{font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="timer-box"><div id="roundName" class="round-name"></div><div id="time" class="time">60:00</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const config={apiKey:"AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",authDomain:"lore-counter-4e654.firebaseapp.com",databaseURL:"https://lore-counter-4e654-default-rtdb.firebaseio.com",projectId:"lore-counter-4e654"};
const db=getDatabase(initializeApp(config));
let state={roundName:"",remaining:3600,running:false,startedAt:0};
function render(){
 const base=Math.max(0,Math.floor(Number(state.remaining)||0));
 const startedAt=Number(state.startedAt)||0;
 const elapsed=state.running&&startedAt>0?Math.max(0,Math.floor((Date.now()-startedAt)/1000)):0;
 const remaining=Math.max(0,base-elapsed);
 document.getElementById("roundName").textContent=state.roundName??"";
 document.getElementById("time").textContent=Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0");
}
onValue(ref(db,"timer"),snap=>{state=snap.val()||{roundName:"",remaining:3600,running:false,startedAt:0};render();});
setInterval(render,250);render();
</script>
</body>
</html>
