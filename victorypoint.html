<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Riftbound Victory Track</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}

.track-wrapper {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
}

.player-name {
  position: absolute;
  top: 34px;
  width: 320px;
  color: white;
  font-size: 34px;
  font-weight: bold;
  text-shadow:
    0 0 10px rgba(0,0,0,.9);
  white-space: nowrap;
  z-index: 100;
}

.player-left {
  left: 280px;
  text-align: right;
}

.player-right {
  right: 280px;
  text-align: left;
}

.victory-track {
  display: flex;
  align-items: center;
  gap: 8px;
}

.point {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid #d8b45a;
  background: rgba(2,6,17,.85);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: bold;
  box-sizing: border-box;
}

.point.active {
  background: #d8b45a;
  color: #071326;
  box-shadow:
    0 0 8px rgba(216,180,90,.9),
    0 0 20px rgba(90,170,255,.7),
    0 0 35px rgba(90,170,255,.4);
}

.center {
  width: 52px;
  height: 52px;
  font-size: 24px;
  border-width: 3px;
}

</style>
</head>

<body>

<div class="overlay">

  <div class="player-name player-left" id="p1Name">
    Player 1
  </div>

  <div class="track-wrapper">
    <div class="victory-track" id="track"></div>
  </div>

  <div class="player-name player-right" id="p2Name">
    Player 2
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const track = document.getElementById("track");

let p1Score = 0;
let p2Score = 0;
let victoryTarget = 8;

function render() {
  track.innerHTML = "";

  for (let i = 1; i < victoryTarget; i++) {
    const point = document.createElement("div");

    point.className = "point";

    if (p1Score === i) {
      point.classList.add("active");
    }

    point.textContent = i;

    track.appendChild(point);
  }

  const center = document.createElement("div");

  center.className = "point center";

  if (
    p1Score === victoryTarget ||
    p2Score === victoryTarget
  ) {
    center.classList.add("active");
  }

  center.textContent = victoryTarget;

  track.appendChild(center);

  for (let i = victoryTarget - 1; i >= 1; i--) {
    const point = document.createElement("div");

    point.className = "point";

    if (p2Score === i) {
      point.classList.add("active");
    }

    point.textContent = i;

    track.appendChild(point);
  }
}

onValue(ref(db, "riftbound/p1"), (snapshot) => {
  p1Score = Number(snapshot.val()) || 0;

  render();
});

onValue(ref(db, "riftbound/p2"), (snapshot) => {
  p2Score = Number(snapshot.val()) || 0;

  render();
});

onValue(ref(db, "riftbound/victoryTarget"), (snapshot) => {
  victoryTarget = Number(snapshot.val()) || 8;

  render();
});

onValue(ref(db, "riftbound/p1Name"), (snapshot) => {
  document.getElementById("p1Name").textContent =
    snapshot.val() || "Player 1";
});

onValue(ref(db, "riftbound/p2Name"), (snapshot) => {
  document.getElementById("p2Name").textContent =
    snapshot.val() || "Player 2";
});

render();

</script>

</body>
</html>
