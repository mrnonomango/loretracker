<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lorcana Lore Tracker</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}


/* =========================================================
   MAIN TOP BROADCAST BAR
========================================================= */

.broadcast-bar {
  position: absolute;

  top: 22px;
  left: 20px;

  width: 1880px;
  height: 125px;

  background:
    linear-gradient(
      180deg,
      rgba(17,17,17,0.96),
      rgba(5,5,5,0.92)
    );

  border: 2px solid #c9a646;

  box-shadow:
    0 4px 16px rgba(0,0,0,0.75);

  display: flex;
  align-items: stretch;

  overflow: hidden;
}


/* =========================================================
   PLAYER PANELS
========================================================= */

.player-panel {
  width: 330px;
  height: 100%;

  position: relative;

  z-index: 5;
}

.player-panel.left {
  border-right:
    2px solid rgba(201,166,70,0.55);
}

.player-panel.right {
  border-left:
    2px solid rgba(201,166,70,0.55);
}


/* =========================================================
   PLAYER NAMES
========================================================= */

.player-name {
  position: absolute;

  top: 10px;

  max-width: 285px;

  color: white;

  font-size: 31px;
  font-weight: 800;

  /* Gives letters like y, g, p, j room underneath */
  line-height: 1.15;

  padding-bottom: 4px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  text-shadow:
    0 2px 5px black;
}

.player-panel.left .player-name {
  left: 22px;
  text-align: left;
}

.player-panel.right .player-name {
  right: 22px;
  text-align: right;
}


/* =========================================================
   GAME WIN ROW
========================================================= */

.game-row {
  position: absolute;

  bottom: -3px;

  display: flex;
  align-items: center;
}

.player-panel.left .game-row {
  left: 22px;
}

.player-panel.right .game-row {
  right: 22px;
}


/* =========================================================
   ILLUMINARY ICON HOLDER
========================================================= */

.game-icons {
  display: flex;
  align-items: center;
}


/* =========================================================
   INDIVIDUAL ILLUMINARY ICON
========================================================= */

.tick {
  position: relative;

  width: 72px;
  height: 72px;

  flex-shrink: 0;

  transition: transform 0.15s ease;
}


/* Pull second icon closer */

.tick + .tick {
  margin-left: -30px;
}


/* =========================================================
   EMPTY OUTLINE
========================================================= */

.empty-outline {
  position: absolute;

  width: 72px;
  height: 72px;

  top: 0;
  left: 0;

  pointer-events: none;
}


.empty-outline svg {
  width: 72px;
  height: 72px;

  display: block;

  overflow: visible;
}


/* =========================================================
   GAME WON FILL
========================================================= */

.win-fill {
  position: absolute;

  width: 50px;
  height: 50px;

  top: 11px;
  left: 11px;

  object-fit: contain;

  display: block;

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.15s ease;
}


.tick.filled .win-fill {
  opacity: 1;
}


/* =========================================================
   WIN PULSE
========================================================= */

.pulse {
  animation: pulse 0.35s ease;
}


@keyframes pulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================================================
   CENTER SECTION
========================================================= */

.center-section {
  flex: 1;

  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;

  min-width: 0;
}


/* =========================================================
   ROUND + TIMER
========================================================= */

.timer-area {
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;

  width: 100%;
}

.round-name {
  color: #d8b45a;

  font-size: 18px;
  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 1.3px;
}

.timer-divider {
  width: 2px;
  height: 25px;

  background:
    rgba(216,180,90,0.65);
}

.timer {
  color: white;

  font-size: 35px;
  font-weight: 900;

  line-height: 1;

  min-width: 115px;

  text-align: center;

  font-variant-numeric:
    tabular-nums;
}


/* =========================================================
   LORE TRACK AREA
========================================================= */

.track-area {
  width: 100%;

  height: 75px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================================
   TRACK
========================================================= */

.lore-track {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 4px;
}


/* =========================================================
   NORMAL LORE POINTS
========================================================= */

.lore-point {
  width: 24px;
  height: 24px;

  border-radius: 50%;

  border:
    2px solid rgba(216,180,90,0.72);

  background:
    rgba(4,6,10,0.90);

  color:
    rgba(255,255,255,0.75);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 11px;
  font-weight: bold;

  flex-shrink: 0;

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    color 0.18s ease,
    border 0.18s ease,
    box-shadow 0.18s ease;
}


/* =========================================================
   ACTIVE LORE
========================================================= */

.lore-point.active {
  transform: scale(1.45);

  background: #d8b45a;

  border-color: #fff3bc;

  color: #111;

  font-size: 12px;

  font-weight: 900;

  z-index: 10;

  box-shadow:
    0 0 8px rgba(216,180,90,0.90),
    0 0 18px rgba(216,180,90,0.55);
}


/* =========================================================
   CENTER 20
========================================================= */

.center-20 {
  width: 42px;
  height: 42px;

  margin: 0 5px;

  border-width: 3px;

  font-size: 18px;

  color: white;

  background:
    linear-gradient(
      180deg,
      #171717,
      #050505
    );

  border-color: #d8b45a;

  flex-shrink: 0;
}

.center-20.active {
  background: #d8b45a;

  color: #111;

  transform: scale(1.14);

  box-shadow:
    0 0 10px rgba(216,180,90,1),
    0 0 24px rgba(216,180,90,0.65);
}


/* =========================================================
   DECORATIVE GOLD EDGES
========================================================= */

.broadcast-bar::before,
.broadcast-bar::after {
  content: "";

  position: absolute;

  top: 0;

  width: 6px;
  height: 100%;

  background: #d8b45a;

  z-index: 20;
}

.broadcast-bar::before {
  left: 0;
}

.broadcast-bar::after {
  right: 0;
}

</style>
</head>


<body>


<!-- =========================================================
     ILLUMINARY OUTLINE MASK
========================================================= -->

<svg
  width="0"
  height="0"
  style="position:absolute;"
>

  <defs>

    <mask
      id="illuminaryOutlineMask"
      maskUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="72"
      height="72"
    >

      <rect
        x="0"
        y="0"
        width="72"
        height="72"
        fill="black"
      />


      <!-- OUTER SHAPE -->

      <image
        href="./Illuminary%20Icon_White.png"
        x="0"
        y="0"
        width="72"
        height="72"
        preserveAspectRatio="xMidYMid meet"
      />


      <!-- INNER CUTOUT -->

      <image
        href="./Illuminary%20Icon_White.png"
        x="11"
        y="11"
        width="50"
        height="50"
        preserveAspectRatio="xMidYMid meet"
        style="filter:brightness(0);"
      />

    </mask>

  </defs>

</svg>



<div class="overlay">


  <div class="broadcast-bar">


    <!-- =====================================================
         PLAYER 1
    ====================================================== -->

    <div class="player-panel left">


      <div
        class="player-name"
        id="p1Name"
      >
        Player 1
      </div>


      <div class="game-row">

        <div class="game-icons">


          <!-- GAME 1 -->

          <div
            id="p1g1"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>


            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>



          <!-- GAME 2 -->

          <div
            id="p1g2"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>


            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


        </div>

      </div>

    </div>



    <!-- =====================================================
         CENTER
    ====================================================== -->

    <div class="center-section">


      <!-- TIMER -->

      <div class="timer-area">


        <div
          class="round-name"
          id="roundName"
        >
          Round 1
        </div>


        <div class="timer-divider"></div>


        <div
          class="timer"
          id="timer"
        >
          55:00
        </div>


      </div>



      <!-- LORE TRACK -->

      <div class="track-area">

        <div
          class="lore-track"
          id="loreTrack"
        ></div>

      </div>


    </div>



    <!-- =====================================================
         PLAYER 2
    ====================================================== -->

    <div class="player-panel right">


      <div
        class="player-name"
        id="p2Name"
      >
        Player 2
      </div>


      <div class="game-row">

        <div class="game-icons">


          <!-- GAME 1 -->

          <div
            id="p2g1"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>


            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>



          <!-- GAME 2 -->

          <div
            id="p2g2"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>


            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


        </div>

      </div>

    </div>


  </div>

</div>



<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";



/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



/* =========================================================
   VALUES
========================================================= */

let p1Lore = 0;

let p2Lore = 0;

let p1Games = 0;

let p2Games = 0;


let lastP1Games = 0;

let lastP2Games = 0;


let timerData = {

  roundName: "Round 1",

  remaining: 3300,

  running: false,

  startedAt: 0

};



/* =========================================================
   LORE TRACK
========================================================= */

const loreTrack =
  document.getElementById("loreTrack");


function createLorePoint(
  number,
  player
) {

  const point =
    document.createElement("div");


  point.className =
    "lore-point";


  point.textContent =
    number;


  if (
    player === "p1" &&
    p1Lore === number
  ) {

    point.classList.add(
      "active"
    );

  }


  if (
    player === "p2" &&
    p2Lore === number
  ) {

    point.classList.add(
      "active"
    );

  }


  return point;

}



function renderLoreTrack() {

  loreTrack.innerHTML = "";


  /* PLAYER 1
     0 → 19
  */

  for (
    let i = 0;
    i <= 19;
    i++
  ) {

    loreTrack.appendChild(

      createLorePoint(
        i,
        "p1"
      )

    );

  }



  /* CENTER 20 */

  const center =
    document.createElement("div");


  center.className =
    "lore-point center-20";


  center.textContent =
    "20";


  if (
    p1Lore >= 20 ||
    p2Lore >= 20
  ) {

    center.classList.add(
      "active"
    );

  }


  loreTrack.appendChild(
    center
  );



  /* PLAYER 2
     19 → 0
  */

  for (
    let i = 19;
    i >= 0;
    i--
  ) {

    loreTrack.appendChild(

      createLorePoint(
        i,
        "p2"
      )

    );

  }

}



/* =========================================================
   GAME WIN ICONS
========================================================= */

function renderGameIcons(
  player,
  wins,
  lastWins
) {

  const game1 =
    document.getElementById(
      player + "g1"
    );


  const game2 =
    document.getElementById(
      player + "g2"
    );


  game1.classList.toggle(
    "filled",
    wins >= 1
  );


  game2.classList.toggle(
    "filled",
    wins >= 2
  );



  /* PULSE ONLY WHEN WIN INCREASES */

  if (wins > lastWins) {

    const target =
      wins === 1
        ? game1
        : game2;


    target.classList.remove(
      "pulse"
    );


    void target.offsetWidth;


    target.classList.add(
      "pulse"
    );


    setTimeout(
      () => {

        target.classList.remove(
          "pulse"
        );

      },

      350
    );

  }

}



/* =========================================================
   TIMER
========================================================= */

function formatTime(
  totalSeconds
) {

  const safe =
    Math.max(
      0,
      Math.floor(
        Number(totalSeconds) || 0
      )
    );


  const minutes =
    Math.floor(
      safe / 60
    );


  const seconds =
    safe % 60;


  return (
    minutes +
    ":" +
    String(seconds)
      .padStart(2,"0")
  );

}



function getTimerRemaining() {

  let remaining =
    Number(
      timerData.remaining ?? 3300
    );


  const running =
    Boolean(
      timerData.running
    );


  const startedAt =
    Number(
      timerData.startedAt ?? 0
    );


  if (
    running &&
    startedAt > 0
  ) {

    const elapsed =
      Math.floor(
        (
          Date.now() -
          startedAt
        ) / 1000
      );


    remaining =
      Math.max(
        0,
        remaining - elapsed
      );

  }


  return remaining;

}



function renderTimer() {

  document
    .getElementById("timer")
    .textContent =
      formatTime(
        getTimerRemaining()
      );


  document
    .getElementById("roundName")
    .textContent =
      timerData.roundName ||
      "Round 1";

}



/* =========================================================
   FIREBASE LISTENERS
========================================================= */


/* PLAYER 1 LORE */

onValue(
  ref(db,"p1"),

  snapshot => {

    p1Lore =
      Number(
        snapshot.val()
      ) || 0;


    renderLoreTrack();

  }
);



/* PLAYER 2 LORE */

onValue(
  ref(db,"p2"),

  snapshot => {

    p2Lore =
      Number(
        snapshot.val()
      ) || 0;


    renderLoreTrack();

  }
);



/* PLAYER 1 GAME WINS */

onValue(
  ref(db,"p1Games"),

  snapshot => {

    p1Games =
      Number(
        snapshot.val()
      ) || 0;


    renderGameIcons(
      "p1",
      p1Games,
      lastP1Games
    );


    lastP1Games =
      p1Games;

  }
);



/* PLAYER 2 GAME WINS */

onValue(
  ref(db,"p2Games"),

  snapshot => {

    p2Games =
      Number(
        snapshot.val()
      ) || 0;


    renderGameIcons(
      "p2",
      p2Games,
      lastP2Games
    );


    lastP2Games =
      p2Games;

  }
);



/* PLAYER 1 NAME */

onValue(
  ref(db,"p1Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();


    document
      .getElementById("p1Name")
      .textContent =
        name || "Player 1";

  }
);



/* PLAYER 2 NAME */

onValue(
  ref(db,"p2Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();


    document
      .getElementById("p2Name")
      .textContent =
        name || "Player 2";

  }
);



/* TIMER */

onValue(
  ref(db,"timer"),

  snapshot => {

    timerData =
      snapshot.val() || {

        roundName:
          "Round 1",

        remaining:
          3300,

        running:
          false,

        startedAt:
          0

      };


    renderTimer();

  }
);



/* LIVE TIMER */

setInterval(
  renderTimer,
  250
);



/* FIRST DRAW */

renderLoreTrack();

renderGameIcons(
  "p1",
  p1Games,
  p1Games
);

renderGameIcons(
  "p2",
  p2Games,
  p2Games
);

renderTimer();

</script>

</body>
</html>
