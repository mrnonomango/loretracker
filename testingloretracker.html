<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lorcana Lore Tracker</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}


/* =========================================================
   MAIN TOP BROADCAST BAR
========================================================= */

.broadcast-bar {
  position: absolute;

  top: 22px;
  left: 20px;

  width: 1880px;
  height: 125px;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(135, 70, 190, 0.55),
      transparent 65%
    ),
    linear-gradient(
      180deg,
      #542a78 0%,
      #3a1c59 32%,
      #251238 65%,
      #13091f 100%
    );

  border: 2px solid #68d000;

  box-shadow:
    0 0 10px rgba(105, 220, 0, 0.35),
    0 4px 16px rgba(0,0,0,0.75);

  display: flex;
  align-items: stretch;

  overflow: hidden;
}


/* =========================================================
   SIDE FACECAM BLOCKS
========================================================= */

.player-panel {
  width: 300px;
  height: 100%;

  position: relative;

  flex-shrink: 0;

  z-index: 5;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(135, 70, 190, 0.25),
      transparent 70%
    ),
    linear-gradient(
      180deg,
      rgba(84,42,120,0.72),
      rgba(19,9,31,0.88)
    );
}

.player-panel.left {
  border-right:
    2px solid rgba(104,208,0,0.75);
}

.player-panel.right {
  border-left:
    2px solid rgba(104,208,0,0.75);
}


/* =========================================================
   CENTER SECTION
========================================================= */

.center-section {
  flex: 1;

  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;

  min-width: 0;
}


/* =========================================================
   TOP MATCH HEADER
========================================================= */

.match-header {
  width: 100%;
  height: 48px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 18px;
}


/* =========================================================
   PLAYER NAMES
========================================================= */

.center-player-name {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  width: 260px;

  color: white;

  font-size: 27px;
  font-weight: 800;

  line-height: 1.15;

  padding-bottom: 3px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  text-shadow:
    0 2px 5px rgba(0,0,0,0.95);
}


/* PLAYER 1 */

.p1-center-name {
  left: 45px;

  text-align: left;
}


/* PLAYER 2 */

.p2-center-name {
  right: 45px;

  text-align: right;
}


/* =========================================================
   CENTER ROUND + TIMER
========================================================= */

.center-match-info {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;

  position: relative;

  z-index: 5;
}


/* =========================================================
   ROUND
========================================================= */

.round-name {
  color: white;

  font-size: 35px;
  font-weight: 900;

  line-height: 1;

  text-transform: uppercase;

  letter-spacing: 1px;

  white-space: nowrap;

  text-shadow:
    0 0 5px #d7f537,
    0 0 12px rgba(105,220,0,0.70);
}


/* =========================================================
   TIMER DIVIDER
========================================================= */

.timer-divider {
  width: 2px;
  height: 25px;

  background: #68d000;

  box-shadow:
    0 0 7px rgba(105,220,0,0.65);

  flex-shrink: 0;
}


/* =========================================================
   TIMER
========================================================= */

.timer {
  color: white;

  font-size: 35px;
  font-weight: 900;

  line-height: 1;

  min-width: 115px;

  text-align: center;

  font-variant-numeric:
    tabular-nums;

  white-space: nowrap;

  text-shadow:
    0 0 5px #d7f537,
    0 0 12px rgba(105,220,0,0.55);
}


/* =========================================================
   GAME WIN ICON GROUPS
========================================================= */

.header-game-icons {
  position: absolute;

  /* ONLY CHANGE:
     MOVED DOWN 12PX
  */
  top: calc(50% + 12px);

  transform: translateY(-50%);

  display: flex;
  align-items: center;

  z-index: 10;
}


/* PLAYER 1
   BETWEEN NAME AND ROUND
*/

.p1-header-games {
  left: 315px;
}


/* PLAYER 2
   BETWEEN TIMER AND NAME
*/

.p2-header-games {
  right: 315px;
}


/* =========================================================
   LARGE ILLUMINARY ICONS
========================================================= */

.tick {
  position: relative;

  width: 72px;
  height: 72px;

  flex-shrink: 0;

  transition: transform 0.15s ease;
}


/* Pull second icon closer */

.tick + .tick {
  margin-left: -30px;
}


/* =========================================================
   EMPTY OUTLINE
========================================================= */

.empty-outline {
  position: absolute;

  width: 72px;
  height: 72px;

  top: 0;
  left: 0;

  pointer-events: none;
}


.empty-outline svg {
  width: 72px;
  height: 72px;

  display: block;

  overflow: visible;
}


/* =========================================================
   GAME WON FILL
========================================================= */

.win-fill {
  position: absolute;

  width: 50px;
  height: 50px;

  top: 11px;
  left: 11px;

  object-fit: contain;

  display: block;

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.15s ease;
}


.tick.filled .win-fill {
  opacity: 1;
}


/* =========================================================
   WIN PULSE
========================================================= */

.pulse {
  animation: winPulse 0.35s ease;
}


@keyframes winPulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================================================
   LORE TRACK AREA
========================================================= */

.track-area {
  width: 100%;

  height: 75px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================================
   LORE TRACK
========================================================= */

.lore-track {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 1px;
}


/* =========================================================
   NORMAL LORE POINT
========================================================= */

.lore-point {
  width: 29px;
  height: 29px;

  border-radius: 50%;

  border:
    2px solid #57b900;

  background:
    radial-gradient(
      circle at 30% 30%,
      #202520 0%,
      #0c0f0c 60%,
      #020302 100%
    );

  color: rgba(255,255,255,0.92);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 13px;
  font-weight: 800;

  line-height: 1;

  flex-shrink: 0;

  text-shadow:
    0 1px 3px rgba(0,0,0,0.95);

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    color 0.18s ease,
    border 0.18s ease,
    box-shadow 0.18s ease;
}


/* =========================================================
   ACTIVE LORE
========================================================= */

.lore-point.active {

  transform: scale(1.50);

  background:
    radial-gradient(
      circle at 30% 30%,
      #f7ff78 0%,
      #bde500 28%,
      #4d8c00 55%,
      #142700 76%,
      #020302 100%
    );

  border:
    3px solid #efff55;

  color: white;

  font-size: 15px;
  font-weight: 900;

  z-index: 10;

  text-shadow:
    0 1px 3px rgba(0,0,0,0.95);

  box-shadow:
    0 0 10px rgba(235,255,80,1),
    0 0 22px rgba(185,235,0,0.95),
    0 0 38px rgba(90,210,0,0.75);

  animation:
    lorePulse 1.2s infinite;
}


/* =========================================================
   ACTIVE LORE PULSE
========================================================= */

@keyframes lorePulse {

  0%,
  100% {

    box-shadow:
      0 0 10px rgba(235,255,80,1),
      0 0 22px rgba(185,235,0,0.95),
      0 0 38px rgba(90,210,0,0.75);
  }

  50% {

    box-shadow:
      0 0 14px rgba(250,255,120,1),
      0 0 30px rgba(210,245,20,1),
      0 0 50px rgba(110,230,0,0.90);
  }

}


/* =========================================================
   CENTER 20
========================================================= */

.center-20 {
  width: 48px;
  height: 48px;

  margin: 0 5px;

  border:
    3px solid #76d900;

  font-size: 20px;

  color: white;

  background:
    radial-gradient(
      circle at 30% 30%,
      #202520 0%,
      #0c0f0c 60%,
      #020302 100%
    );

  flex-shrink: 0;

  box-shadow:
    0 0 8px rgba(105,220,0,0.25);
}


.center-20.active {

  background:
    radial-gradient(
      circle at 30% 30%,
      #f7ff78 0%,
      #bde500 28%,
      #4d8c00 55%,
      #142700 76%,
      #020302 100%
    );

  border:
    4px solid #efff55;

  color: white;

  transform: scale(1.12);

  box-shadow:
    0 0 12px rgba(235,255,80,1),
    0 0 28px rgba(185,235,0,1),
    0 0 48px rgba(90,210,0,0.85);

  animation:
    lorePulse 1.2s infinite;
}


/* =========================================================
   GREEN OUTSIDE EDGES
========================================================= */

.broadcast-bar::before,
.broadcast-bar::after {

  content: "";

  position: absolute;

  top: 0;

  width: 6px;
  height: 100%;

  background: #68d000;

  box-shadow:
    0 0 8px rgba(105,220,0,0.55);

  z-index: 20;
}


.broadcast-bar::before {
  left: 0;
}


.broadcast-bar::after {
  right: 0;
}

</style>
</head>


<body>


<!-- =========================================================
     ILLUMINARY OUTLINE MASK
========================================================= -->

<svg
  width="0"
  height="0"
  style="position:absolute;"
>

  <defs>

    <mask
      id="illuminaryOutlineMask"
      maskUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="72"
      height="72"
    >

      <rect
        x="0"
        y="0"
        width="72"
        height="72"
        fill="black"
      />


      <image
        href="./Illuminary%20Icon_White.png"
        x="0"
        y="0"
        width="72"
        height="72"
        preserveAspectRatio="xMidYMid meet"
      />


      <image
        href="./Illuminary%20Icon_White.png"
        x="11"
        y="11"
        width="50"
        height="50"
        preserveAspectRatio="xMidYMid meet"
        style="filter:brightness(0);"
      />

    </mask>

  </defs>

</svg>



<div class="overlay">


  <div class="broadcast-bar">


    <!-- PLAYER 1 FACECAM -->

    <div class="player-panel left">
    </div>



    <!-- CENTER -->

    <div class="center-section">


      <div class="match-header">


        <!-- PLAYER 1 NAME -->

        <div
          class="center-player-name p1-center-name"
          id="p1Name"
        >
          Player 1
        </div>



        <!-- PLAYER 1 GAME WINS -->

        <div class="header-game-icons p1-header-games">


          <div
            id="p1g1"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


          <div
            id="p1g2"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


        </div>



        <!-- ROUND + TIMER -->

        <div class="center-match-info">


          <div
            class="round-name"
            id="roundName"
          >
            Round 1
          </div>


          <div class="timer-divider"></div>


          <div
            class="timer"
            id="timer"
          >
            55:00
          </div>


        </div>



        <!-- PLAYER 2 GAME WINS -->

        <div class="header-game-icons p2-header-games">


          <div
            id="p2g1"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


          <div
            id="p2g2"
            class="tick"
          >

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">

                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />

              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


        </div>



        <!-- PLAYER 2 NAME -->

        <div
          class="center-player-name p2-center-name"
          id="p2Name"
        >
          Player 2
        </div>


      </div>



      <!-- LORE TRACK -->

      <div class="track-area">

        <div
          class="lore-track"
          id="loreTrack"
        ></div>

      </div>


    </div>



    <!-- PLAYER 2 FACECAM -->

    <div class="player-panel right">
    </div>


  </div>

</div>



<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",

  authDomain:
    "lore-counter-4e654.firebaseapp.com",

  databaseURL:
    "https://lore-counter-4e654-default-rtdb.firebaseio.com",

  projectId:
    "lore-counter-4e654"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



let p1Lore = 0;

let p2Lore = 0;

let p1Games = 0;

let p2Games = 0;

let lastP1Games = 0;

let lastP2Games = 0;


let timerData = {

  roundName: "Round 1",

  remaining: 3300,

  running: false,

  startedAt: 0

};



/* =========================================================
   LORE TRACK
========================================================= */

const loreTrack =
  document.getElementById("loreTrack");


function createLorePoint(
  number,
  player
) {

  const point =
    document.createElement("div");


  point.className =
    "lore-point";


  point.textContent =
    number;


  if (
    player === "p1" &&
    p1Lore === number
  ) {

    point.classList.add(
      "active"
    );

  }


  if (
    player === "p2" &&
    p2Lore === number
  ) {

    point.classList.add(
      "active"
    );

  }


  return point;

}



function renderLoreTrack() {

  loreTrack.innerHTML = "";


  for (
    let i = 0;
    i <= 19;
    i++
  ) {

    loreTrack.appendChild(

      createLorePoint(
        i,
        "p1"
      )

    );

  }



  const center =
    document.createElement("div");


  center.className =
    "lore-point center-20";


  center.textContent =
    "20";


  if (
    p1Lore >= 20 ||
    p2Lore >= 20
  ) {

    center.classList.add(
      "active"
    );

  }


  loreTrack.appendChild(
    center
  );



  for (
    let i = 19;
    i >= 0;
    i--
  ) {

    loreTrack.appendChild(

      createLorePoint(
        i,
        "p2"
      )

    );

  }

}



/* =========================================================
   GAME WIN ICONS
========================================================= */

function renderGameIcons(
  player,
  wins,
  lastWins
) {

  const game1 =
    document.getElementById(
      player + "g1"
    );


  const game2 =
    document.getElementById(
      player + "g2"
    );


  game1.classList.toggle(
    "filled",
    wins >= 1
  );


  game2.classList.toggle(
    "filled",
    wins >= 2
  );


  if (wins > lastWins) {

    const target =
      wins === 1
        ? game1
        : game2;


    target.classList.remove(
      "pulse"
    );


    void target.offsetWidth;


    target.classList.add(
      "pulse"
    );


    setTimeout(
      () => {

        target.classList.remove(
          "pulse"
        );

      },

      350
    );

  }

}



/* =========================================================
   TIMER
========================================================= */

function formatTime(
  totalSeconds
) {

  const safe =
    Math.max(
      0,
      Math.floor(
        Number(totalSeconds) || 0
      )
    );


  const minutes =
    Math.floor(
      safe / 60
    );


  const seconds =
    safe % 60;


  return (
    minutes +
    ":" +
    String(seconds)
      .padStart(2,"0")
  );

}



function getTimerRemaining() {

  let remaining =
    Number(
      timerData.remaining ?? 3300
    );


  const running =
    Boolean(
      timerData.running
    );


  const startedAt =
    Number(
      timerData.startedAt ?? 0
    );


  if (
    running &&
    startedAt > 0
  ) {

    const elapsed =
      Math.floor(
        (
          Date.now() -
          startedAt
        ) / 1000
      );


    remaining =
      Math.max(
        0,
        remaining - elapsed
      );

  }


  return remaining;

}



function renderTimer() {

  document
    .getElementById("timer")
    .textContent =
      formatTime(
        getTimerRemaining()
      );


  document
    .getElementById("roundName")
    .textContent =
      timerData.roundName ||
      "Round 1";

}



/* =========================================================
   FIREBASE
========================================================= */

onValue(
  ref(db,"p1"),

  snapshot => {

    p1Lore =
      Number(
        snapshot.val()
      ) || 0;


    renderLoreTrack();

  }
);



onValue(
  ref(db,"p2"),

  snapshot => {

    p2Lore =
      Number(
        snapshot.val()
      ) || 0;


    renderLoreTrack();

  }
);



onValue(
  ref(db,"p1Games"),

  snapshot => {

    p1Games =
      Number(
        snapshot.val()
      ) || 0;


    renderGameIcons(
      "p1",
      p1Games,
      lastP1Games
    );


    lastP1Games =
      p1Games;

  }
);



onValue(
  ref(db,"p2Games"),

  snapshot => {

    p2Games =
      Number(
        snapshot.val()
      ) || 0;


    renderGameIcons(
      "p2",
      p2Games,
      lastP2Games
    );


    lastP2Games =
      p2Games;

  }
);



onValue(
  ref(db,"p1Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();


    document
      .getElementById("p1Name")
      .textContent =
        name || "Player 1";

  }
);



onValue(
  ref(db,"p2Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();


    document
      .getElementById("p2Name")
      .textContent =
        name || "Player 2";

  }
);



onValue(
  ref(db,"timer"),

  snapshot => {

    timerData =
      snapshot.val() || {

        roundName:
          "Round 1",

        remaining:
          3300,

        running:
          false,

        startedAt:
          0

      };


    renderTimer();

  }
);



setInterval(
  renderTimer,
  250
);



renderLoreTrack();


renderGameIcons(
  "p1",
  p1Games,
  p1Games
);


renderGameIcons(
  "p2",
  p2Games,
  p2Games
);


renderTimer();

</script>

</body>
</html>
