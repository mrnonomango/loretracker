<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lorcana Lore Tracker</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}


/* =========================================================
   OVERALL BROADCAST AREA
========================================================= */

.broadcast-wrap {
  position: absolute;
  top: 22px;
  left: 20px;
  width: 1880px;
  height: 220px;
}


/* =========================================================
   TOP BAR
   GOLD + BLUE CENTER THEME
========================================================= */

.broadcast-bar {
  position: absolute;
  top: 0;
  left: 0;

  width: 1880px;
  height: 125px;

  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(255, 234, 150, .26),
      rgba(255, 234, 150, 0) 42%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(55, 145, 210, .22),
      rgba(55, 145, 210, 0) 55%
    ),
    linear-gradient(
      180deg,
      #214d78 0%,
      #123150 34%,
      #0b1e32 68%,
      #050c15 100%
    );

  border: 2px solid #f0c85b;

  box-shadow:
    inset 0 0 25px rgba(255, 240, 175, .06),
    inset 0 0 45px rgba(35, 115, 180, .10),
    inset 0 0 60px rgba(0, 0, 0, .80),
    0 0 8px rgba(240, 200, 91, .24),
    0 4px 16px rgba(0, 0, 0, .75);

  overflow: hidden;

  z-index: 1;
}


/* =========================================================
   GOLD OUTER EDGES
========================================================= */

.broadcast-bar::before,
.broadcast-bar::after {
  content: "";

  position: absolute;
  top: 0;

  width: 6px;
  height: 100%;

  background:
    linear-gradient(
      180deg,
      #fff0ad,
      #d79a22
    );

  box-shadow:
    0 0 8px rgba(255, 220, 120, .45);

  z-index: 5;
}

.broadcast-bar::before {
  left: 0;
}

.broadcast-bar::after {
  right: 0;
}


/* =========================================================
   FACECAM PODS
========================================================= */

.player-panel {
  position: absolute;
  top: 0;

  width: 300px;
  height: 220px;

  z-index: 3;

  background:
    radial-gradient(
      circle at 50% 88%,
      rgba(255, 238, 170, .20),
      rgba(255, 238, 170, 0) 32%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(255, 204, 70, .18),
      rgba(255, 204, 70, 0) 45%
    ),
    linear-gradient(
      180deg,
      #f9d66d 0%,
      #f3c44f 32%,
      #eeb43a 68%,
      #d99724 100%
    );

  border: 2px solid #f8dc82;

  box-shadow:
    inset 0 0 30px rgba(255, 245, 190, .12),
    inset 0 0 70px rgba(128, 75, 0, .18),
    0 0 8px rgba(255, 210, 90, .18),
    0 4px 16px rgba(0, 0, 0, .55);

  overflow: hidden;
}

.player-panel::before {
  content: "";

  position: absolute;
  inset: 10px;

  border: 1px solid rgba(255, 243, 190, .50);

  pointer-events: none;

  z-index: 20;
}

.player-panel.left {
  left: 0;
}

.player-panel.right {
  right: 0;
}


/* =========================================================
   CENTER SECTION
========================================================= */

.center-section {
  position: absolute;
  top: 0;
  left: 300px;

  width: 1280px;
  height: 125px;

  z-index: 4;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}


/* =========================================================
   MATCH HEADER
========================================================= */

.match-header {
  width: 100%;
  height: 48px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 18px;
}


/* =========================================================
   PLAYER NAMES
========================================================= */

.center-player-name {
  position: absolute;
  top: 50%;

  transform: translateY(-50%);

  width: 260px;

  color: #ffffff;

  font-size: 27px;
  font-weight: 800;
  line-height: 1.15;

  padding-bottom: 3px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  text-shadow:
    0 2px 4px rgba(0, 0, 0, .95),
    0 0 5px rgba(255, 230, 145, .18);
}

.p1-center-name {
  left: 45px;
  text-align: left;
}

.p2-center-name {
  right: 45px;
  text-align: right;
}


/* =========================================================
   ROUND + TIMER
========================================================= */

.center-match-info {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;

  position: relative;
  z-index: 5;
}


/* =========================================================
   ROUND
========================================================= */

.round-name {
  color: #ffffff;

  font-size: 35px;
  font-weight: 900;
  line-height: 1;

  text-transform: uppercase;
  letter-spacing: 1px;
  white-space: nowrap;

  text-shadow:
    0 0 2px rgba(255, 255, 255, .95),
    0 0 7px rgba(170, 245, 255, .65),
    0 0 14px rgba(55, 205, 255, .32);
}


/* =========================================================
   TIMER DIVIDER
========================================================= */

.timer-divider {
  width: 2px;
  height: 25px;

  background: #f0c85b;

  box-shadow:
    0 0 7px rgba(240, 200, 91, .70);

  flex-shrink: 0;
}


/* =========================================================
   TIMER
========================================================= */

.timer {
  color: #ffffff;

  font-size: 35px;
  font-weight: 900;
  line-height: 1;

  min-width: 115px;

  text-align: center;

  font-variant-numeric: tabular-nums;
  white-space: nowrap;

  text-shadow:
    0 0 2px rgba(255, 255, 255, .95),
    0 0 7px rgba(170, 245, 255, .65),
    0 0 14px rgba(55, 205, 255, .32);
}


/* =========================================================
   GAME WIN ICON GROUPS
========================================================= */

.header-game-icons {
  position: absolute;

  top: calc(50% + 12px);

  transform: translateY(-50%);

  display: flex;
  align-items: center;

  z-index: 10;
}


/* LOCKED AT 360PX */

.p1-header-games {
  left: 360px;
}

.p2-header-games {
  right: 360px;
}


/* =========================================================
   ILLUMINARY ICONS
========================================================= */

.tick {
  position: relative;

  width: 72px;
  height: 72px;

  flex-shrink: 0;

  transition: transform .15s ease;
}

.tick + .tick {
  margin-left: -30px;
}


/* =========================================================
   EMPTY OUTLINE
========================================================= */

.empty-outline {
  position: absolute;

  width: 72px;
  height: 72px;

  top: 0;
  left: 0;

  pointer-events: none;
}

.empty-outline svg {
  width: 72px;
  height: 72px;

  display: block;
  overflow: visible;
}


/* =========================================================
   GAME WON FILL
========================================================= */

.win-fill {
  position: absolute;

  width: 50px;
  height: 50px;

  top: 11px;
  left: 11px;

  object-fit: contain;

  display: block;

  opacity: 0;

  pointer-events: none;

  transition: opacity .15s ease;
}

.tick.filled .win-fill {
  opacity: 1;
}


/* =========================================================
   WIN PULSE
========================================================= */

.pulse {
  animation: winPulse .35s ease;
}

@keyframes winPulse {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }

  100% {
    transform: scale(1);
  }
}


/* =========================================================
   LORE TRACK AREA
========================================================= */

.track-area {
  width: 100%;
  height: 75px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================================
   LORE TRACK
========================================================= */

.lore-track {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 0;
}


/* =========================================================
   NORMAL LORE POINT
========================================================= */

.lore-point {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  border: 2px solid #c9962d;

  background:
    radial-gradient(
      circle at 30% 30%,
      #16324b 0%,
      #0b1c2d 56%,
      #040a11 100%
    );

  color: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 16px;
  font-weight: 800;
  line-height: 1;

  flex-shrink: 0;

  text-shadow:
    0 1px 3px rgba(0, 0, 0, .95);

  box-shadow:
    inset 0 0 8px rgba(65, 165, 225, .08),
    0 0 2px rgba(240, 200, 91, .08);

  transition:
    transform .18s ease,
    background .18s ease,
    color .18s ease,
    border .18s ease,
    box-shadow .18s ease;
}


/* =========================================================
   ACTIVE LORE
   NEW ICY CYAN GLOW
========================================================= */

.lore-point.active {
  transform: scale(1.50);

  background:
    radial-gradient(
      circle at 30% 30%,
      #fffdf1 0%,
      #ffe9a0 20%,
      #e8b83f 40%,
      #2d8dbd 58%,
      #0c4269 75%,
      #03101e 100%
    );

  border: 3px solid #dffcff;

  color: #ffffff;

  font-size: 16px;
  font-weight: 900;

  z-index: 10;

  text-shadow:
    0 1px 3px rgba(0, 0, 0, .95),
    0 0 4px rgba(0, 0, 0, .65);

  box-shadow:
    0 0 10px rgba(235, 255, 255, 1),
    0 0 22px rgba(140, 245, 255, .95),
    0 0 42px rgba(50, 205, 255, .85),
    0 0 68px rgba(0, 135, 255, .55),
    inset 0 0 14px rgba(230, 255, 255, .70);

  animation: lorePulse 1.2s infinite;
}


/* =========================================================
   ACTIVE LORE PULSE
   CYAN / BLUE
========================================================= */

@keyframes lorePulse {

  0%,
  100% {
    box-shadow:
      0 0 10px rgba(235, 255, 255, 1),
      0 0 22px rgba(140, 245, 255, .95),
      0 0 42px rgba(50, 205, 255, .85),
      0 0 68px rgba(0, 135, 255, .55),
      inset 0 0 14px rgba(230, 255, 255, .70);
  }

  50% {
    box-shadow:
      0 0 16px rgba(255, 255, 255, 1),
      0 0 34px rgba(175, 250, 255, 1),
      0 0 60px rgba(75, 220, 255, .95),
      0 0 92px rgba(0, 145, 255, .72),
      inset 0 0 20px rgba(235, 255, 255, .90);
  }

}


/* =========================================================
   CENTER 20
========================================================= */

.center-20 {
  width: 48px;
  height: 48px;

  margin: 0 5px;

  border: 3px solid #e1b447;

  font-size: 20px;

  color: #ffffff;

  background:
    radial-gradient(
      circle at 30% 30%,
      #17456a 0%,
      #0b2944 48%,
      #061525 72%,
      #02070d 100%
    );

  flex-shrink: 0;

  box-shadow:
    0 0 6px rgba(218, 170, 55, .20),
    inset 0 0 10px rgba(55, 160, 220, .20);
}


/* =========================================================
   CENTER 20 ACTIVE
========================================================= */

.center-20.active {
  background:
    radial-gradient(
      circle at 30% 30%,
      #fffdf1 0%,
      #ffe9a0 20%,
      #e8b83f 40%,
      #2d8dbd 58%,
      #0c4269 75%,
      #03101e 100%
    );

  border: 4px solid #dffcff;

  color: #ffffff;

  transform: scale(1.12);

  box-shadow:
    0 0 10px rgba(235, 255, 255, 1),
    0 0 22px rgba(140, 245, 255, .95),
    0 0 42px rgba(50, 205, 255, .85),
    0 0 68px rgba(0, 135, 255, .55),
    inset 0 0 14px rgba(230, 255, 255, .70);

  animation: lorePulse 1.2s infinite;
}

</style>
</head>

<body>

<svg
  width="0"
  height="0"
  style="position:absolute;"
>
  <defs>
    <mask
      id="illuminaryOutlineMask"
      maskUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="72"
      height="72"
    >

      <rect
        x="0"
        y="0"
        width="72"
        height="72"
        fill="black"
      />

      <image
        href="./Illuminary%20Icon_White.png"
        x="0"
        y="0"
        width="72"
        height="72"
        preserveAspectRatio="xMidYMid meet"
      />

      <image
        href="./Illuminary%20Icon_White.png"
        x="11"
        y="11"
        width="50"
        height="50"
        preserveAspectRatio="xMidYMid meet"
        style="filter:brightness(0);"
      />

    </mask>
  </defs>
</svg>


<div class="overlay">

  <div class="broadcast-wrap">

    <div class="broadcast-bar"></div>

    <div class="player-panel left"></div>

    <div class="player-panel right"></div>

    <div class="center-section">

      <div class="match-header">

        <div
          class="center-player-name p1-center-name"
          id="p1Name"
        >
          Player 1
        </div>


        <div class="header-game-icons p1-header-games">

          <div id="p1g1" class="tick">

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">
                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />
              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


          <div id="p1g2" class="tick">

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">
                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />
              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>

        </div>


        <div class="center-match-info">

          <div
            class="round-name"
            id="roundName"
          >
            Round 1
          </div>

          <div class="timer-divider"></div>

          <div
            class="timer"
            id="timer"
          >
            55:00
          </div>

        </div>


        <div class="header-game-icons p2-header-games">

          <div id="p2g1" class="tick">

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">
                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />
              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>


          <div id="p2g2" class="tick">

            <div class="empty-outline">

              <svg viewBox="0 0 72 72">
                <rect
                  x="0"
                  y="0"
                  width="72"
                  height="72"
                  fill="white"
                  mask="url(#illuminaryOutlineMask)"
                />
              </svg>

            </div>

            <img
              class="win-fill"
              src="./Illuminary%20Icon_White.png"
            >

          </div>

        </div>


        <div
          class="center-player-name p2-center-name"
          id="p2Name"
        >
          Player 2
        </div>

      </div>


      <div class="track-area">

        <div
          class="lore-track"
          id="loreTrack"
        ></div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCGlW1px3ZbK1qVFwVK-v4gP-d9KSGVj0U",
  authDomain: "lore-counter-4e654.firebaseapp.com",
  databaseURL: "https://lore-counter-4e654-default-rtdb.firebaseio.com",
  projectId: "lore-counter-4e654"
};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


let p1Lore = 0;
let p2Lore = 0;

let p1Games = 0;
let p2Games = 0;

let lastP1Games = 0;
let lastP2Games = 0;


let timerData = {
  roundName: "Round 1",
  remaining: 3300,
  running: false,
  startedAt: 0
};


const loreTrack =
  document.getElementById("loreTrack");


function createLorePoint(
  number,
  player
) {

  const point =
    document.createElement("div");

  point.className =
    "lore-point";

  point.textContent =
    number;


  if (
    player === "p1" &&
    p1Lore === number
  ) {
    point.classList.add("active");
  }


  if (
    player === "p2" &&
    p2Lore === number
  ) {
    point.classList.add("active");
  }


  return point;
}


function renderLoreTrack() {

  loreTrack.innerHTML = "";


  for (
    let i = 0;
    i <= 19;
    i++
  ) {
    loreTrack.appendChild(
      createLorePoint(i, "p1")
    );
  }


  const center =
    document.createElement("div");

  center.className =
    "lore-point center-20";

  center.textContent =
    "20";


  if (
    p1Lore >= 20 ||
    p2Lore >= 20
  ) {
    center.classList.add("active");
  }


  loreTrack.appendChild(center);


  for (
    let i = 19;
    i >= 0;
    i--
  ) {
    loreTrack.appendChild(
      createLorePoint(i, "p2")
    );
  }

}


function renderGameIcons(
  player,
  wins,
  lastWins
) {

  const game1 =
    document.getElementById(
      player + "g1"
    );

  const game2 =
    document.getElementById(
      player + "g2"
    );


  game1.classList.toggle(
    "filled",
    wins >= 1
  );


  game2.classList.toggle(
    "filled",
    wins >= 2
  );


  if (wins > lastWins) {

    const target =
      wins === 1
        ? game1
        : game2;

    target.classList.remove("pulse");

    void target.offsetWidth;

    target.classList.add("pulse");


    setTimeout(
      () => {
        target.classList.remove("pulse");
      },
      350
    );

  }

}


function formatTime(
  totalSeconds
) {

  const safe =
    Math.max(
      0,
      Math.floor(
        Number(totalSeconds) || 0
      )
    );

  const minutes =
    Math.floor(safe / 60);

  const seconds =
    safe % 60;

  return (
    minutes +
    ":" +
    String(seconds).padStart(2, "0")
  );

}


function getTimerRemaining() {

  let remaining =
    Number(
      timerData.remaining ?? 3300
    );

  const running =
    Boolean(timerData.running);

  const startedAt =
    Number(timerData.startedAt ?? 0);


  if (
    running &&
    startedAt > 0
  ) {

    const elapsed =
      Math.floor(
        (Date.now() - startedAt) / 1000
      );

    remaining =
      Math.max(
        0,
        remaining - elapsed
      );

  }

  return remaining;
}


function renderTimer() {

  document
    .getElementById("timer")
    .textContent =
      formatTime(
        getTimerRemaining()
      );


  document
    .getElementById("roundName")
    .textContent =
      timerData.roundName ||
      "Round 1";

}


onValue(
  ref(db, "p1"),

  snapshot => {

    p1Lore =
      Number(snapshot.val()) || 0;

    renderLoreTrack();

  }
);


onValue(
  ref(db, "p2"),

  snapshot => {

    p2Lore =
      Number(snapshot.val()) || 0;

    renderLoreTrack();

  }
);


onValue(
  ref(db, "p1Games"),

  snapshot => {

    p1Games =
      Number(snapshot.val()) || 0;

    renderGameIcons(
      "p1",
      p1Games,
      lastP1Games
    );

    lastP1Games =
      p1Games;

  }
);


onValue(
  ref(db, "p2Games"),

  snapshot => {

    p2Games =
      Number(snapshot.val()) || 0;

    renderGameIcons(
      "p2",
      p2Games,
      lastP2Games
    );

    lastP2Games =
      p2Games;

  }
);


onValue(
  ref(db, "p1Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();

    document
      .getElementById("p1Name")
      .textContent =
        name || "Player 1";

  }
);


onValue(
  ref(db, "p2Name"),

  snapshot => {

    const name =
      String(
        snapshot.val() || ""
      ).trim();

    document
      .getElementById("p2Name")
      .textContent =
        name || "Player 2";

  }
);


onValue(
  ref(db, "timer"),

  snapshot => {

    timerData =
      snapshot.val() || {
        roundName: "Round 1",
        remaining: 3300,
        running: false,
        startedAt: 0
      };

    renderTimer();

  }
);


setInterval(
  renderTimer,
  250
);


renderLoreTrack();


renderGameIcons(
  "p1",
  p1Games,
  p1Games
);


renderGameIcons(
  "p2",
  p2Games,
  p2Games
);


renderTimer();

</script>

</body>
</html>
