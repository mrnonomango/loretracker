<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lorcana Cookout — Motion FX Lab</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070c18;color:#eee;font-family:Arial,Helvetica,sans-serif}main{max-width:1360px;margin:auto;padding:18px}
h1{font-size:23px;margin:0 0 7px;color:#f0cf8c}p{margin:0 0 15px;color:#a8bcd8;font-size:13px}
nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}button{cursor:pointer;border:1px solid #537194;border-radius:8px;background:#172844;color:#dbe8f8;padding:11px 16px;font-weight:800}
button.active,#replay{border-color:#c19c5a;background:#2c293c;color:#f9d9a0}
#stage{position:relative;aspect-ratio:16/9;border:1px solid #3d5777;border-radius:8px;overflow:hidden;background:#040916;isolation:isolate}
canvas{width:100%;height:100%;display:block}#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 38%,#0008188c)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transform:translateY(15px)}
#kicker{font-size:clamp(8px,1.2vw,18px);letter-spacing:.48em;color:#eccd92;font-weight:800;text-shadow:0 2px 10px #000}
#big{margin:1.3% 0;font-size:clamp(32px,7.1vw,106px);font-weight:900;letter-spacing:-.06em;line-height:1.1;color:#f4f1e9;text-shadow:0 8px 28px #0009}#big span{color:#f2c67c}
#small{font-size:clamp(8px,1.2vw,18px);font-weight:800;letter-spacing:.38em;color:#aac3e4}
#controls{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:12px}#info{font-size:12px;color:#a5b9ce}
</style></head><body><main><h1>THE LORCANA COOKOUT — MOTION FX LAB</h1>
<p>Three completely different motion effects. Built as animated previews—not static illustrations.</p>
<nav><button data-kind="hyperspace" class="active">01 · Hyperspace</button><button data-kind="formation">02 · Particle Formation</button><button data-kind="embers">03 · Ember Storm</button></nav>
<div id="stage"><canvas id="fx" width="1600" height="900"></canvas><div id="vignette"></div>
<div id="overlay"><div id="kicker">THE LORCANA COOKOUT</div><div id="big">LIVE <span>BROADCAST</span></div><div id="small">TOURNAMENT COVERAGE</div></div></div>
<div id="controls"><button id="replay">↻ Replay animation</button><span id="info">4.5 second animation · Hyperspace</span></div>
</main><script>
(()=>{
const C=document.getElementById('fx'),ctx=C.getContext('2d'),W=C.width,H=C.height,PI=Math.PI;
let mode='hyperspace',anim=null,start=0,uid=0;
const particles=[],chars=[];
function rng(seed){let a=seed>>>0;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}
const rand=rng(874133);
function reset(){
particles.length=0;chars.length=0;
if(mode==='hyperspace'){
 for(let i=0;i<1050;i++)particles.push({x:(rand()-.5)*2.5,y:(rand()-.5)*1.8,z:.08+rand()*3.9,s:.7+rand()*2.1,tint:rand()});
}else if(mode==='formation'){
 const off=document.createElement('canvas');off.width=W;off.height=H;
 const o=off.getContext('2d');o.textAlign='center';o.textBaseline='middle';o.font='900 145px Arial';o.fillStyle='white';o.fillText('THE COOKOUT',W/2,H/2);
 const dat=o.getImageData(0,0,W,H).data;
 for(let y=H/2-120;y<H/2+120;y+=5){for(let x=90;x<W-90;x+=5){
 if(dat[(y*W+x)*4+3]>200 && rand()<.65)particles.push({x,y,angle:rand()*2*PI,dist:300+rand()*740,seed:rand(),s:1+rand()*2.1,c:rand()})
 }}
}else{
 for(let i=0;i<1800;i++)particles.push({x:rand()*W,y:rand()*H,s:.5+rand()*2.8,v:.4+rand()*2.2,phase:rand()*2*PI,gold:rand()>.35,life:rand()});
}
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function backdrop(){
let g=ctx.createRadialGradient(W*.52,H*.48,20,W*.52,H*.48,W*.85);g.addColorStop(0,'#102b52');g.addColorStop(.46,'#08162c');g.addColorStop(1,'#01050d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function hyperspace(t){
 backdrop();const speed= .17+3.0*smooth(.1,1.9,t)*(1-.55*smooth(2.5,4.5,t));
 ctx.save();ctx.translate(W/2,H/2);ctx.globalCompositeOperation='lighter';
 for(const p of particles){
  const z=((p.z-t*speed+36)%4)+.12;const prevZ=z+.03+.12*speed;
  let x=p.x*560/z,y=p.y*560/z;let x0=p.x*560/prevZ,y0=p.y*560/prevZ;
  if(Math.abs(x)>W||Math.abs(y)>H)continue;
  let a=clamp((4-z)/3,.05,1),gold=p.tint>.76;
  ctx.strokeStyle=gold?'rgba(255,192,101,'+a*.8+')':'rgba(105,174,255,'+a*.75+')';
  ctx.lineWidth=p.s*(.7+1/z*.55);
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();
  if(z<1.5){ctx.fillStyle=gold?'#ffd9a3':'#c0e4ff';ctx.fillRect(x-1,y-1,p.s*1.2,p.s*1.2)}
 }
 ctx.restore();
 const a=smooth(.55,1.6,t)*(1-smooth(2.2,3.2,t));
 let glow=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,380);glow.addColorStop(0,'rgba(130,197,255,'+a*.47+')');glow.addColorStop(1,'rgba(33,98,200,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}
function formation(t){
 backdrop();ctx.save();ctx.globalCompositeOperation='lighter';
 let settle=smooth(.4,2.4,t);let dissolve=smooth(3.15,4.35,t);
 for(const p of particles){
  const spiral=p.angle+t*1.15;const d=p.dist*(1-settle)+p.dist*.6*dissolve;
  let x=p.x+Math.cos(spiral)*d,y=p.y+Math.sin(spiral*1.2)*d*.59;
  let alpha=(.2+.8*settle)*(1-dissolve*.9);
  const gold=p.c>.72;ctx.fillStyle=gold?'rgba(249,197,112,'+alpha+')':'rgba(111,184,255,'+alpha+')';
  ctx.fillRect(x,y,p.s+settle*.7,p.s+settle*.7);
 }
 ctx.restore();
}
function embers(t){
 backdrop();ctx.save();ctx.globalCompositeOperation='lighter';
 const sweep=smooth(.1,1.9,t)*(1-.4*smooth(2.8,4.5,t));
 const heat=ctx.createRadialGradient(W*.35,H*.75,10,W*.35,H*.75,580);
 heat.addColorStop(0,'rgba(235,139,47,'+(.13+.26*sweep)+')');heat.addColorStop(.5,'rgba(74,71,117,.13)');heat.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=heat;ctx.fillRect(0,0,W,H);
 for(const p of particles){
  const step=t*(38+p.v*70);
  let x=((p.x+Math.sin(step*.009+p.phase)*45+t*60)%W+W)%W;
  let y=((p.y-step+H*4)%H+H)%H;
  const wave=(Math.sin((x/W)*10-t*2+p.phase)*.5+.5);
  const a=(.2+.8*wave)*(.45+.55*sweep);
  ctx.strokeStyle=p.gold?'rgba(255,181,79,'+a+')':'rgba(70,151,244,'+a*.8+')';
  ctx.lineWidth=p.s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-10-p.v*2,y+14+p.v*8);ctx.stroke();
 }
 ctx.restore();
}
function frame(t){
 t=Math.min(4.5,Math.max(0,t));if(mode==='hyperspace')hyperspace(t);else if(mode==='formation')formation(t);else embers(t);
 // Fade typography in only during the final broadcast hold; particles make the whole scene.
 const text=document.getElementById('overlay');
 let on=smooth(1.6,2.25,t)*(1-smooth(3.48,4.15,t));
 text.style.opacity=on;
 text.style.transform='translateY('+((1-on)*17)+'px)';
}
function run(){
 uid++;const my=uid;const epoch=performance.now();cancelAnimationFrame(anim);
 function tick(now){if(uid!==my)return;const t=((now-epoch)/1000);frame(t);if(t<4.5)anim=requestAnimationFrame(tick);}
 anim=requestAnimationFrame(tick);
}
function select(next){mode=next;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===next));document.getElementById('info').textContent='4.5 second animation · '+({hyperspace:'Hyperspace',formation:'Particle Formation',embers:'Ember Storm'}[next]);reset();run();}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.kind)));
document.getElementById('replay').addEventListener('click',run);
select(mode);
})();
</script></body></html>
